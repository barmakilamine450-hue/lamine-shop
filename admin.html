<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lamine Pro — تسيير المحل</title>
<meta name="theme-color" content="#3B1F14">
<link rel="manifest" href="admin.webmanifest">
<link rel="icon" href="pro-192.png">
<link rel="apple-touch-icon" href="pro-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lamine Pro">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F1EA; --card:#FFFFFF; --ink:#24140C; --muted:#8C776B; --line:#EFE3D8; --soft:#FBF6F1;
  --brand:#E8721C; --brand-d:#C65A0E; --choc:#3B1F14; --choc2:#5A3322;
  --ok:#17935A; --okbg:#E3F6EC; --warn:#C27C00; --warnbg:#FFF3DC; --bad:#D6453D; --badbg:#FDE7E5; --info:#2D5BD0; --infobg:#E8F0FF;
  --r:20px; --shadow:0 1px 2px rgba(59,31,20,.05),0 8px 24px rgba(59,31,20,.07);
  --nav-h:68px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal","SF Arabic","Segoe UI",Tahoma,system-ui,sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
img{max-width:100%;display:block}
.hidden{display:none!important}
bdi,.num{unicode-bidi:isolate;direction:ltr}
.muted{color:var(--muted)}
small{font-size:13px}

/* ===== الهيكل ===== */
.shell{display:flex;min-height:100vh}
.side{display:none}
.mainw{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--choc),var(--choc2));color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 12px;box-shadow:0 6px 20px rgba(36,20,12,.18)}
.top .row{display:flex;align-items:center;gap:12px;max-width:1200px;margin:0 auto}
.top .lg{width:42px;height:42px;border-radius:13px;background:#fff;padding:3px;object-fit:contain;flex:none}
.top .tt{flex:1;min-width:0}
.top .tt b{display:block;font-size:18px;line-height:1.15}
.top .tt small{opacity:.78;font-size:12.5px}
.top .ib{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:19px;position:relative;flex:none}
.top .ib .dot{position:absolute;top:6px;left:6px;width:9px;height:9px;border-radius:9px;background:#FF5A4E;box-shadow:0 0 0 2px var(--choc)}
.page{width:100%;max-width:1200px;margin:0 auto;padding:14px 14px calc(var(--nav-h) + 26px + env(safe-area-inset-bottom))}
.ptitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 12px}
.ptitle h1{font-size:22px;margin:0}

/* التنقل تحت (التيليفون) */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;justify-content:space-around;align-items:stretch;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(255,255,255,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:800;color:var(--muted);position:relative}
.nav button i{font-style:normal;font-size:22px;line-height:1}
.nav button.on{color:var(--brand-d)}
.nav button.on::before{content:"";position:absolute;top:0;width:34px;height:3px;border-radius:0 0 4px 4px;background:var(--brand)}
.nav .pos-btn i{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;display:grid;place-items:center;margin-top:-22px;box-shadow:0 8px 18px rgba(232,114,28,.4);font-size:22px}
.badge{position:absolute;top:6px;right:calc(50% - 22px);background:var(--bad);color:#fff;border-radius:99px;font-size:10.5px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px;font-style:normal}

/* الكمبيوتر: قائمة جانبية */
@media(min-width:980px){
  .side{display:flex;flex-direction:column;width:250px;flex:none;background:linear-gradient(180deg,var(--choc),#2A150D);color:#fff;position:sticky;top:0;height:100vh;padding:18px 12px}
  .side .brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}
  .side .brand img{width:46px;height:46px;border-radius:14px;background:#fff;padding:3px;object-fit:contain}
  .side .brand b{display:block;font-size:17px}.side .brand small{opacity:.7;font-size:12px}
  .side button{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:14px;font-weight:700;color:rgba(255,255,255,.78);position:relative;text-align:right}
  .side button i{font-style:normal;font-size:20px;width:24px;text-align:center}
  .side button:hover{background:rgba(255,255,255,.07)}
  .side button.on{background:rgba(255,255,255,.14);color:#fff}
  .side button .badge{position:static;margin-inline-start:auto}
  .side .foot{margin-top:auto;font-size:12.5px;opacity:.7;padding:10px}
  .nav{display:none}
  .top .menu-only{display:none}
  .page{padding-bottom:40px}
}

/* ===== العناصر ===== */
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:17px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi small{color:var(--muted);font-weight:700;font-size:12.5px;display:block}
.kpi b{display:block;font-size:22px;margin-top:4px;letter-spacing:-.3px}
.kpi .ic{position:absolute;left:10px;top:10px;font-size:22px;opacity:.9}
.kpi.dark{background:linear-gradient(135deg,var(--choc),var(--choc2));color:#fff}
.kpi.dark small{color:rgba(255,255,255,.75)}
.kpi.or{background:linear-gradient(135deg,#F08A35,var(--brand-d));color:#fff}
.kpi.or small{color:rgba(255,255,255,.85)}
@media(min-width:980px){.two{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;align-items:start}}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;text-decoration:none;background:var(--brand);color:#fff;border-radius:15px;padding:14px;font-weight:800;font-size:16.5px;text-align:center}
.btn.dark{background:var(--choc)}
.btn.ghost{background:#F3EAE1;color:var(--ink)}
.btn.green{background:var(--ok)}
.btn.red{background:var(--bad)}
.btn.sm{padding:10px 12px;font-size:15px;border-radius:12px;width:auto}
.btn:disabled{opacity:.5}
.mini{display:inline-flex;align-items:center;gap:5px;background:#F3EAE1;border-radius:11px;padding:8px 12px;font-weight:700;font-size:14px;text-decoration:none;color:inherit;white-space:nowrap}
.mini.or{background:var(--brand);color:#fff}
.mini.red{background:var(--badbg);color:var(--bad)}
.mini.green{background:var(--okbg);color:var(--ok)}
.mini.wa{background:#1FAF5A;color:#fff}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

label.f{display:block;margin:12px 0 5px;font-weight:800;font-size:14px}
.in{width:100%;border:1.5px solid var(--line);border-radius:13px;padding:12px 13px;background:#fff;font-size:16px}
.in:focus{outline:2px solid var(--brand);border-color:transparent}
select.in{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#8C776B 50%),linear-gradient(135deg,#8C776B 50%,transparent 50%);background-position:16px 52%,11px 52%;background-size:5px 5px;background-repeat:no-repeat;padding-left:30px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.err{color:var(--bad);font-size:13.5px;margin-top:8px;min-height:1em;font-weight:700}
.note{background:#FFF7E8;border-radius:13px;padding:11px 13px;font-size:14px;color:#7A5A12;margin:8px 0;line-height:1.6}
.note.info{background:var(--infobg);color:#24489E}
.note.bad{background:var(--badbg);color:#9A2A23}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.empty b{display:block;font-size:42px;margin-bottom:8px}

.search{display:flex;gap:8px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:15px;padding:0 12px;margin-bottom:10px}
.search input{flex:1;border:0;background:none;padding:12px 4px;font-size:16px;min-width:0}
.search input:focus{outline:none}
.search button{font-size:20px;padding:6px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;background:#fff;border:1.5px solid var(--line);border-radius:99px;padding:8px 14px;font-weight:700;font-size:14px}
.chip.on{background:var(--choc);border-color:var(--choc);color:#fff}
.chip .n{opacity:.7;margin-inline-start:4px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.seg button{border:1.5px solid var(--line);border-radius:12px;padding:9px 13px;font-weight:800;background:#fff;font-size:14.5px}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff}

.list .it{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:18px;padding:11px;box-shadow:var(--shadow);margin-bottom:9px;cursor:pointer}
.it .th{width:54px;height:54px;border-radius:14px;background:var(--soft);object-fit:cover;flex:none;display:grid;place-items:center;font-size:24px;overflow:hidden}
.it .th img{width:100%;height:100%;object-fit:cover}
.it .t{flex:1;min-width:0}
.it .t b{display:block;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .t small{color:var(--muted)}
.it .e{text-align:left;flex:none}
.it .e b{display:block;font-size:16px}
.pill{display:inline-block;border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:800;white-space:nowrap}
.p-ok{background:var(--okbg);color:var(--ok)}.p-warn{background:var(--warnbg);color:var(--warn)}.p-bad{background:var(--badbg);color:var(--bad)}.p-info{background:var(--infobg);color:var(--info)}.p-mut{background:#F1EAE3;color:var(--muted)}
.st-new{background:var(--infobg);color:var(--info)}.st-conf{background:var(--warnbg);color:var(--warn)}.st-ship{background:#EFE6FF;color:#6A3FC7}.st-done{background:var(--okbg);color:var(--ok)}.st-cancel{background:var(--badbg);color:var(--bad)}

.alert{display:flex;gap:10px;align-items:center;border-radius:16px;padding:12px 14px;margin-bottom:9px;font-weight:700;font-size:14.5px;cursor:pointer}
.alert i{font-style:normal;font-size:22px}
.alert.bad{background:var(--badbg);color:#9A2A23}.alert.warn{background:var(--warnbg);color:#87570A}.alert.info{background:var(--infobg);color:#24489E}.alert.ok{background:var(--okbg);color:#0F6B40}
.alert .go{margin-inline-start:auto;opacity:.6}

/* ===== النوافذ ===== */
.ov{position:fixed;inset:0;background:rgba(30,15,8,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fd .18s}
.sheet{background:#fff;width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease-out}
.sheet.wide{max-width:900px}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:26px}}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
@keyframes fd{from{opacity:0}to{opacity:1}}
.sheet h2{margin:0 0 12px;font-size:20px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.x{font-size:26px;line-height:1;color:var(--muted);width:36px;height:36px;border-radius:12px;background:#F3EAE1}
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 14px);left:50%;transform:translateX(-50%);background:var(--choc);color:#fff;padding:11px 18px;border-radius:14px;z-index:99;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:92vw;text-align:center}

/* ===== الكاسة ===== */
.pos{display:block}
@media(min-width:980px){.pos{display:grid;grid-template-columns:1fr 380px;gap:14px;align-items:start}.pos .cartp{position:sticky;top:84px}}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.pgrid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1200px){.pgrid{grid-template-columns:repeat(4,1fr)}}
.pc{background:#fff;border-radius:18px;box-shadow:var(--shadow);overflow:hidden;text-align:right;display:flex;flex-direction:column;position:relative}
.pc .im{height:96px;background:var(--soft);display:grid;place-items:center;font-size:30px;overflow:hidden}
@media(min-width:980px){.pc .im{height:120px}}
.pc .im.noimg{height:58px;font-size:24px}
.pc .im img{width:100%;height:100%;object-fit:cover}
.pc .bd{padding:8px 10px 10px}
.pc .bd b{display:block;font-size:14.5px;line-height:1.3;height:2.6em;overflow:hidden}
.pc .bd .pr{color:var(--brand-d);font-weight:900;margin-top:4px}
.pc .q{position:absolute;top:7px;left:7px}
.pc.out{opacity:.55}
.cartp{background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:14px}
.cl{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.cl .t{flex:1;min-width:0}
.cl .t b{display:block;font-size:15px}
.cl .t small{color:var(--muted)}
.step{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;flex:none}
.step button{width:34px;height:34px;font-size:20px;font-weight:800;background:var(--soft)}
.step span{min-width:44px;text-align:center;font-weight:800;font-size:15px}
.tot{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:22px;margin:12px 0 6px}
.cartbar{transition:opacity .2s,transform .2s;position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + 10px + env(safe-area-inset-bottom));z-index:35}
@media(min-width:980px){.cartbar{display:none}}

/* ===== التقارير ===== */
.bars{display:flex;align-items:flex-end;gap:4px;height:160px;padding:6px 0 0;border-bottom:1.5px solid var(--line);direction:ltr}
.bars .b{flex:1;background:linear-gradient(180deg,#F5A15E,var(--brand));border-radius:6px 6px 2px 2px;min-height:2px;position:relative}
.bars .b.p{background:linear-gradient(180deg,#5FD09A,var(--ok))}
.blab{display:flex;gap:4px;direction:ltr;font-size:10.5px;color:var(--muted);margin-top:4px}
.blab span{flex:1;text-align:center;overflow:hidden}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{color:var(--muted);font-weight:800;font-size:12.5px;text-align:right;padding:6px 4px;border-bottom:1.5px solid var(--line)}
.tbl td{padding:9px 4px;border-bottom:1px solid var(--line)}
.tbl td.n{text-align:left;font-weight:800;white-space:nowrap}

/* ===== الدخول ===== */
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 22px;text-align:center;background:radial-gradient(circle at 50% 0,#FFE6D2,transparent 60%),var(--bg)}
.login img{width:110px;height:110px;border-radius:30px;background:#fff;padding:8px;box-shadow:var(--shadow);object-fit:contain;margin-bottom:16px}
.login h1{margin:0 0 6px;font-size:26px}
.login p{color:var(--muted);max-width:360px;line-height:1.7}
.login .btn{max-width:340px;margin-top:10px}

/* ===== الكاميرا ===== */
.cam{position:fixed;inset:0;z-index:80;background:#000;display:flex;flex-direction:column}
.cam video{flex:1;width:100%;object-fit:cover}
.cam .frame{position:absolute;left:8%;right:8%;top:38%;height:22%;border:3px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:0 0 0 9999px rgba(0,0,0,.35)}
.cam .line{position:absolute;left:10%;right:10%;top:49%;height:2px;background:#FF5A4E;box-shadow:0 0 12px #FF5A4E;animation:scan 1.6s ease-in-out infinite alternate}
@keyframes scan{from{transform:translateY(-40px)}to{transform:translateY(40px)}}
.cam .tx{position:absolute;top:calc(env(safe-area-inset-top) + 20px);left:0;right:0;text-align:center;color:#fff;font-weight:800;text-shadow:0 2px 6px #000}
.cam .cl2{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 26px);left:0;right:0;display:flex;justify-content:center}

/* ===== البون ===== */
.bonwrap{display:flex;justify-content:center;padding:4px 0 10px}
.bon{width:340px;max-width:100%;background:#fff;color:#111;font-family:"Segoe UI",Tahoma,Arial,sans-serif;direction:ltr;padding:14px 12px 12px;border:1px solid #e6e6e6;border-radius:6px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
.bon .logo{width:84px;height:auto;margin:0 auto 4px;display:block}
.bon h3{margin:2px 0 2px;font-size:21px;text-align:center}
.bon .sub{text-align:center;font-size:12.5px;line-height:1.5}
.bon .band{background:#1d1d1d;color:#fff;text-align:center;font-weight:800;padding:6px;margin:8px 0;font-size:15px;letter-spacing:.5px}
.bon .kv{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:1.5px 0}
.bon .kv b{font-weight:700;text-align:right}
.bon .cli{border:1.5px solid #222;margin:8px 0;font-size:13px}
.bon .cli div{display:flex;border-bottom:1px solid #222}
.bon .cli div:last-child{border-bottom:0}
.bon .cli span{padding:4px 6px}
.bon .cli span:first-child{width:76px;flex:none;border-right:1px solid #222;font-weight:700;background:#f2f2f2;font-size:11px;line-height:1.25;text-align:center}
.bon .cli span:last-child{flex:1;direction:rtl;text-align:right}
.bon table{width:100%;border-collapse:collapse;margin:8px 0 6px;font-size:13px}
.bon th,.bon td{border:1.5px solid #222;padding:5px 4px;text-align:center;vertical-align:middle}
.bon th{background:#1d1d1d;color:#fff;font-size:11.5px;line-height:1.25;font-weight:700}
.bon td.n{text-align:right;direction:rtl;font-weight:700}
.bon td.m{text-align:right;font-weight:800;white-space:nowrap}
.bon td.d{color:#999}
.bon .tot{display:flex;justify-content:space-between;align-items:center;border:2px solid #111;background:#1d1d1d;color:#fff;border-radius:8px;padding:10px 12px;margin:8px 0;font-weight:900;font-size:21px}
.bon .tot small{font-size:12px;font-weight:600;opacity:.8;display:block}
.bon .bc{display:flex;justify-content:center;margin:8px 0 2px}
.bon .bc svg{max-width:240px;height:auto}
.bon .dash{border-top:1.5px dashed #555;margin:8px 0}
.bon .merci{text-align:center;font-size:13px;line-height:1.6}
.bonacts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
#printArea{display:none}
@media print{
  @page{margin:0}
  html,body{background:#fff!important;margin:0!important;padding:0!important;height:auto!important;min-height:0!important;overflow:visible!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;width:72mm;margin:0 auto;padding:2mm 0 6mm}
  #printArea .bon{width:72mm!important;max-width:none!important;border:0!important;box-shadow:none!important;border-radius:0!important;padding:0!important;margin:0!important}
  /* طباعة خفيفة وسريعة على Xprinter: بلا خلفيات كحلة */
  #printArea .band,#printArea th,#printArea .tot,#printArea .cli span:first-child{background:#fff!important;color:#000!important}
  #printArea .band{border:2px solid #000}
  #printArea th{border-width:1.5px}
  #printArea .tot{border-radius:0}
  #printArea .tot small{opacity:1}
  #printArea .logo{width:56px}
}
.demo{background:#FFE9A8;color:#6B4A00;text-align:center;font-size:13px;padding:6px 10px;font-weight:700}

.cartbar.away{opacity:0;transform:translateY(20px);pointer-events:none}
.pos-pad{height:70px}
@media(min-width:980px){.pos-pad{display:none}}

/* ===== وضع الكاسة ===== */
.pos2{display:block}
.pscan{position:sticky;top:calc(env(safe-area-inset-top) + 68px);z-index:25;margin:-14px -14px 10px;padding:10px 14px 8px;background:var(--bg)}
.search.big{border:2px solid var(--brand);box-shadow:0 6px 20px rgba(232,114,28,.15);margin:0}
.search.big input{font-size:17px;padding:14px 4px;font-weight:700}
.sug{display:none;position:absolute;left:14px;right:14px;top:100%;background:#fff;border-radius:18px;box-shadow:0 18px 40px rgba(36,20,12,.22);max-height:56vh;overflow:auto;padding:6px;z-index:30}
.sug.on{display:block}
.sg{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border-radius:13px;text-align:right}
.sg .th{width:42px;height:42px;font-size:20px}
.sg .t{flex:1;min-width:0}.sg .t b{display:block;font-size:15px}.sg .t small{color:var(--muted)}
.sg.sel,.sg:hover{background:#FFF1E6}
.sg.none{color:var(--muted);font-size:14px;padding:12px;justify-content:center}
.ticket{background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:10px}
.ticket .thead{display:flex;align-items:center;gap:8px;padding-bottom:6px;border-bottom:1.5px solid var(--line)}
.ticket .thead b{font-size:17px}.ticket .thead .mini{margin-inline-start:auto}
.cl .lt{min-width:86px;text-align:left;font-size:15.5px}
.cl.flash{animation:fl 1s ease-out}
@keyframes fl{from{background:#FFE3CC}to{background:transparent}}
.step span{cursor:pointer}
.disc{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;margin-top:10px}
.disc .in{padding:9px 12px}
.browse-btn{margin-bottom:12px}
.paybar{position:fixed;left:10px;right:10px;bottom:calc(var(--nav-h) + 8px + env(safe-area-inset-bottom));z-index:35;display:flex;gap:8px;align-items:center;background:linear-gradient(135deg,var(--choc),var(--choc2));color:#fff;border-radius:22px;padding:10px;box-shadow:0 14px 34px rgba(36,20,12,.35)}
.paybar.off{display:none}
.paybar .pt{flex:1;padding:0 8px}.paybar .pt small{opacity:.75;display:block;font-size:12px}.paybar .pt b{font-size:24px;letter-spacing:-.3px}
.paybar .btn{width:auto;padding:13px 16px;font-size:16px}
.pos2 .pcol-grid{display:none}
.pos2::after{content:"";display:block;height:84px}
.pc.inc{outline:2.5px solid var(--brand)}
.pc .incart{position:absolute;top:7px;right:7px;background:var(--brand);color:#fff;border-radius:99px;padding:2px 8px;font-size:12px;font-weight:800}
@media(min-width:980px){
  .pos2{display:grid;grid-template-columns:420px 1fr;gap:16px;align-items:start}
  .pos2::after{display:none}
  .pcol-cart{position:sticky;top:84px;display:flex;flex-direction:column;max-height:calc(100vh - 100px)}
  .pscan{position:relative;top:0;margin:0 0 10px;padding:0;background:none}
  .sug{left:0;right:0}
  .ticket{flex:1;overflow:auto;min-height:200px}
  .pos2 .pcol-grid{display:block}
  .browse-btn{display:none}
  .paybar{position:static;margin:0}
}

/* ===== الوصول السريع ===== */
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:700px){.qa{grid-template-columns:1fr 1fr 1fr}}
.qt{display:flex;align-items:center;gap:10px;text-align:right;background:var(--soft);border-radius:16px;padding:12px;position:relative}
.qt i{font-style:normal;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:22px;flex:none;color:#fff}
.qt.g i{background:#1F8F4E}.qt.r i{background:#D6453D}.qt.p i{background:#6A4FD0}.qt.b i{background:#2D6BD8}.qt.o i{background:var(--brand)}
.qt span{flex:1;min-width:0}.qt b{display:block;font-size:15px}.qt small{color:var(--muted);font-size:12.5px;display:block;line-height:1.3}
.qt em{position:absolute;top:6px;left:8px;font-style:normal;font-size:11px;color:var(--muted);font-weight:800}
@media(max-width:979px){.qt em{display:none}}

/* ===== الكاسة في الكمبيوتر (على شكل سهلها) ===== */
.pd{position:fixed;inset:0;z-index:45;background:#E9E2DA;display:grid;grid-template-columns:118px minmax(0,1fr);gap:8px;padding:8px;font-size:15px}
.pd-act{display:flex;flex-direction:column;gap:6px;overflow:auto}
.pa{width:100%;flex:1;min-height:56px;max-height:92px;background:#fff;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:var(--shadow);border:2px solid transparent}
.pa i{font-style:normal;font-size:22px;line-height:1}.pa b{font-size:13.5px;text-align:center;line-height:1.15}.pa small{font-size:11px;color:var(--muted);font-weight:800}
.pa.g{background:#1F8F4E;color:#fff;flex:1.5}.pa.g small{color:rgba(255,255,255,.8)}
.pa.b{background:#2D6BD8;color:#fff;flex:1.3}.pa.b small{color:rgba(255,255,255,.8)}
.pa.r{color:var(--bad);border-color:#F5C9C5}.pa.x{background:var(--choc);color:#fff}.pa.x small{color:rgba(255,255,255,.7)}
.pa:active{transform:scale(.97)}
.pd-main{display:grid;grid-template-rows:auto auto minmax(0,1fr) minmax(190px,34vh);gap:8px;min-height:0;min-width:0}
.pd-top{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:8px}
.pd-total{background:linear-gradient(135deg,var(--choc),#1E0F08);color:#fff;border-radius:20px;padding:10px 18px;position:relative;display:flex;flex-direction:column;justify-content:center}
.pd-total small{opacity:.75;font-weight:700}.pd-total b{font-size:clamp(30px,3.6vw,50px);line-height:1.05;letter-spacing:-.5px}
.pd-disc{position:absolute;top:8px;left:10px;background:rgba(255,255,255,.14);color:#fff;border-radius:10px;padding:4px 10px;font-size:12.5px;font-weight:800}
.pd-card{background:#fff;border-radius:20px;padding:10px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0}
.pd-card small{color:var(--muted);font-weight:800;font-size:12.5px}.pd-card b{font-size:19px}.pd-card .muted{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pd-scan{position:relative;display:flex;align-items:center;gap:8px;background:#1F8F4E;border-radius:16px;padding:4px 14px;color:#fff}
.pd-scan input{flex:1;border:0;background:transparent;color:#fff;font-size:19px;font-weight:800;padding:12px 4px;min-width:0}
.pd-scan input::placeholder{color:rgba(255,255,255,.75)}.pd-scan input:focus{outline:none}
.pd-scan button{font-size:22px}
.pd-scan .sug{left:0;right:0;color:var(--ink)}
.pd-mid{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:8px;min-height:0}
.pd-lines{background:#fff;border-radius:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.pd-held{display:flex;gap:6px;align-items:center;padding:8px 10px;background:#F6EFE8;overflow-x:auto;white-space:nowrap;font-size:13.5px;flex:none}
.pd-held button{background:var(--choc);color:#fff;border-radius:10px;padding:6px 10px;font-weight:800;font-size:13px}
.pd-tbl{flex:1;overflow:auto;min-height:0}
.pd-tbl table{width:100%;border-collapse:collapse}
.pd-tbl th{position:sticky;top:0;background:#fff;color:var(--muted);font-size:12.5px;text-align:right;padding:8px;border-bottom:1.5px solid var(--line)}
.pd-tbl td{padding:7px 8px;border-bottom:1px solid var(--line);font-size:15px}
.pd-tbl td.i{color:var(--muted);width:30px}.pd-tbl td.nm{font-weight:800}.pd-tbl td.t{font-weight:900;text-align:left;white-space:nowrap}
.pd-tbl tr{cursor:pointer}.pd-tbl tr.sel td{background:#FFE9D6}
.qs{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.qs button{width:30px;height:30px;background:var(--soft);font-size:18px;font-weight:900}.qs b{min-width:34px;text-align:center}
.pd-cust{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-top:1.5px solid var(--line);font-size:13.5px;flex:none}
.pd-cust:empty{display:none}
.pd-empty{text-align:center;color:var(--muted);padding:28px 10px;line-height:1.8}.pd-empty b{font-size:36px;display:block}
.pd-kp{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:8px;display:flex;flex-direction:column;gap:6px;min-height:0}
.kpd{background:var(--choc);color:#fff;border-radius:14px;padding:6px 12px;display:flex;justify-content:space-between;align-items:center}
.kpd small{opacity:.7}.kpd b{font-size:24px}.pd-kp.on .kpd,.kpd.on{background:var(--brand)}
.kpg{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;flex:1;min-height:0;direction:ltr}
.kpg button,.kpm button{background:var(--soft);border-radius:12px;font-size:22px;font-weight:900;min-height:34px}
.kpg button.c{color:var(--bad)}
.kpm{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;direction:ltr}.kpm button{font-size:15px;color:var(--info)}
.kpa{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.kpa button{background:#F3EAE1;border-radius:12px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;font-size:16px;line-height:1.1}
.kpa button b{font-size:12.5px}.kpa button small{font-size:10.5px;color:var(--muted)}.kpa button.r{background:var(--badbg);color:var(--bad)}
.pd-bot{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:8px;min-height:0}
.pd-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));grid-auto-rows:minmax(74px,auto);gap:6px;overflow:auto;background:#2A1A12;border-radius:18px;padding:6px;align-content:start}
.pt{background:#3E2A1F;color:#fff;border-radius:12px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:3px;position:relative;overflow:hidden;border:1.5px solid #5A4033}
.pt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.28}
.pt b,.pt span,.pt i{position:relative}.pt b{font-size:13.5px;line-height:1.25}.pt span{font-size:12.5px;color:#FFC58F;font-weight:800}
.pt i{font-style:normal;font-size:11px}
.pt:active{transform:scale(.97)}.pt.out{opacity:.45}
.pd-groups{display:flex;flex-direction:column;gap:5px;overflow:auto}
.pd-groups button{background:#fff;border-radius:12px;padding:8px 10px;text-align:right;box-shadow:var(--shadow);border-inline-start:4px solid var(--line)}
.pd-groups button b{display:block;font-size:14px}.pd-groups button small{color:var(--muted);font-size:11.5px}
.pd-groups button.on{background:#1F8F4E;color:#fff;border-color:#0E5C30}.pd-groups button.on small{color:rgba(255,255,255,.8)}
@media(max-height:700px){.pd-main{grid-template-rows:auto auto minmax(0,1fr) minmax(150px,30vh)}.pd-total b{font-size:30px}.kpg button{font-size:18px}}

/* ===== 🔐 الدخول بالكود ===== */
.pinlog img{width:90px;height:90px;border-radius:24px;margin-bottom:8px}
.pclock{font-size:14px;color:var(--muted);margin-bottom:6px}
.pdots{font-size:34px;letter-spacing:12px;min-height:48px;margin:8px 0 2px;color:var(--ink,#24140C)}
.perr{color:#C62828;font-weight:700;min-height:22px}
.ppad{display:grid;grid-template-columns:repeat(3,92px);gap:12px;justify-content:center;margin-top:8px;direction:ltr}
.pk{height:76px;border:0;border-radius:20px;background:#fff;box-shadow:var(--shadow);font-size:30px;font-weight:800;color:#24140C;cursor:pointer;font-family:inherit}
.pk:active{transform:scale(.96);background:#FFE6D2}
.ppad .pk:last-child{background:var(--brand,#E8721C);color:#fff}

</style>

/* ============================================================

const Fire = {
  name: "fire",
  async init() {
    const v = "10.12.2", base = `https://www.gstatic.com/firebasejs/${v}/`;
    for (const f of ["firebase-app-compat.js", "firebase-auth-compat.js", "firebase-firestore-compat.js"]) await loadScript(base + f);
    firebase.initializeApp(FIREBASE_CONFIG);
    this.db = firebase.firestore();
    try { await this.db.enablePersistence({synchronizeTabs: true}); } catch (e) { console.warn("persistence", e.code); }
    this.auth = firebase.auth();
    // يحضّر الدخول بـ Google من البداية (الأنترنت الثقيلة) + يكمّل الدخول بالطريقة الثانية
    this.auth.getRedirectResult().catch(e => { console.warn("redirect", e.code); if (e.code && e.code !== "auth/no-auth-event") setTimeout(() => toast("❌ ما قدرتش ندخل: " + e.code, 6000), 900); });
  },
  inc: n => firebase.firestore.FieldValue.increment(n),
  q(col, o) { o = o || {}; let q = this.db.collection(col); (o.where||[]).forEach(w => q = q.where(...w)); if (o.order) q = q.orderBy(...o.order); if (o.limit) q = q.limit(o.limit); return q; },
  watch(col, cb, o) { return this.q(col, o).onSnapshot(s => cb(s.docs.map(d => ({id: d.id, ...d.data()}))), e => { console.error(col, e); cb(null, e); }); },
  watchDoc(col, id, cb) { return this.db.collection(col).doc(id).onSnapshot(d => cb(d.exists ? {id: d.id, ...d.data()} : null), e => { console.error(col, id, e); cb(null, e); }); },
  async get(col, id) { const d = await this.db.collection(col).doc(id).get(); return d.exists ? {id: d.id, ...d.data()} : null; },
  // من الذاكرة أولا (سريع وبلا أنترنت)، وإلا من السيرفر مع حد للوقت
  async getFast(col, id) {
    const ref = this.db.collection(col).doc(id);
    try { const d = await ref.get({source: "cache"}); if (d.exists) return {id: d.id, ...d.data()}; } catch (e) {}
    const d = await Promise.race([ref.get(), new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 15000))]);
    return d.exists ? {id: d.id, ...d.data()} : null;
  },
  async list(col, o) { const s = await this.q(col, o).get(); return s.docs.map(d => ({id: d.id, ...d.data()})); },
  set(col, id, d, merge) { return this.db.collection(col).doc(id).set(d, merge ? {merge: true} : {}); },
  update(col, id, d) { return this.db.collection(col).doc(id).update(d); },
  remove(col, id) { return this.db.collection(col).doc(id).delete(); },
  commit(ops) {
    const b = this.db.batch();
    for (const o of ops) { const ref = this.db.collection(o.c).doc(o.id); if (o.t === "set") b.set(ref, o.d, o.merge ? {merge: true} : {}); else if (o.t === "update") b.update(ref, o.d); else b.delete(ref); }
    return b.commit();
  },
  signIn() {
    const p = new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({prompt: "select_account"});
    // كي تكون الأنترنت ثقيلة (ولا صفحة Google تقطع الصلة مع النافذة)، Firebase يحسب النافذة «تسكّرت» قبل الوقت.
    // نعطيوه 3 دقايق باش يستنى نتيجة الدخول.
    const realOpen = window.open;
    window.open = function (...a) {
      window.open = realOpen;
      const w = realOpen.apply(window, a); if (!w) return w;
      const t0 = Date.now();
      try { return new Proxy(w, {get(t, k) { if (k === "closed") return t.closed && Date.now() - t0 > 180000; const v = t[k]; return typeof v === "function" ? v.bind(t) : v; }}); }
      catch (e) { return w; }
    };
    return this.auth.signInWithPopup(p)
      .finally(() => { window.open = realOpen; })
      .catch(e => { if (/popup-blocked|operation-not-supported/.test(e.code||"")) return this.auth.signInWithRedirect(p); throw e; });
  },
  signInRedirect() { const p = new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({prompt: "select_account"}); return this.auth.signInWithRedirect(p); },
  signOut() { return this.auth.signOut(); },
  onUser(cb) { this.auth.onAuthStateChanged(u => cb(u)); }
};

const Demo = {
  name: "demo", subs: [],
  _all(c) { return ls("lpd_" + c) || {}; },
  _save(c, m) { ls("lpd_" + c, m); this.subs.filter(s => s.c === c).forEach(s => s.run()); },
  inc: n => ({__inc: n}),
  _apply(old, d) { const o = {...(old||{})}; for (const [k, v] of Object.entries(d)) { if (v && typeof v === "object" && "__inc" in v) o[k] = (+o[k] || 0) + v.__inc; else o[k] = v; } return o; },
  _filter(arr, o) {
    o = o || {}; let a = arr;
    (o.where||[]).forEach(([f, op, v]) => a = a.filter(x => op === "==" ? x[f] === v : op === ">=" ? x[f] >= v : op === "<=" ? x[f] <= v : op === "<" ? x[f] < v : op === ">" ? x[f] > v : true));
    if (o.order) { const [f, dir] = o.order; a = [...a].sort((x, y) => (x[f] > y[f] ? 1 : x[f] < y[f] ? -1 : 0) * (dir === "desc" ? -1 : 1)); }
    if (o.limit) a = a.slice(0, o.limit);
    return a;
  },
  _arr(c) { return Object.entries(this._all(c)).map(([id, d]) => ({id, ...d})); },
  async init() {},
  watch(c, cb, o) { const s = {c, run: () => cb(this._filter(this._arr(c), o))}; this.subs.push(s); setTimeout(s.run, 0); return () => this.subs.splice(this.subs.indexOf(s), 1); },
  watchDoc(c, id, cb) { const s = {c, run: () => { const d = this._all(c)[id]; cb(d ? {id, ...d} : null); }}; this.subs.push(s); setTimeout(s.run, 0); return () => this.subs.splice(this.subs.indexOf(s), 1); },
  async get(c, id) { const d = this._all(c)[id]; return d ? {id, ...d} : null; },
  async list(c, o) { return this._filter(this._arr(c), o); },
  async set(c, id, d, merge) { const m = this._all(c); m[id] = merge ? this._apply(m[id], d) : this._apply({}, d); this._save(c, m); },
  async update(c, id, d) { const m = this._all(c); if (!m[id]) throw new Error("not-found"); m[id] = this._apply(m[id], d); this._save(c, m); },
  async remove(c, id) { const m = this._all(c); delete m[id]; this._save(c, m); },
  async commit(ops) { for (const o of ops) { if (o.t === "set") await this.set(o.c, o.id, o.d, o.merge); else if (o.t === "update") await this.update(o.c, o.id, o.d); else await this.remove(o.c, o.id); } },
  signIn() { ls("lpd_user", {uid: new URLSearchParams(location.search).get("as") || "demo-owner", email: "demo@local", displayName: "تجربة"}); location.reload(); return Promise.resolve(); },
  signOut() { localStorage.removeItem("lpd_user"); location.reload(); return Promise.resolve(); },
  onUser(cb) { cb(ls("lpd_user")); }
};

/* حركة المخزون: كل بيعة، شراء، طلبية، تعديل */
function stockOps(changes, reason, ref="") {
  // changes: [{pid, delta}]  → ops + رسائل التنبيه
  const ops = [], msgs = [], now = Date.now();
  for (const ch of changes) {
    const p = prod(ch.pid), inv = S.inv[ch.pid];
    if (!p) continue;
    const tracked = !!inv && inv.qty != null;
    if (!tracked && !ch.create) continue;                 // سلعة ما هيش متبعة في المخزون
    const before = tracked ? (+inv.qty || 0) : 0, after = r2(before + ch.delta), min = minOf(ch.pid);
    const d = {qty: tracked ? DB.inc(r2(ch.delta)) : after, updatedAt: now};
    let alert = inv ? (inv.alert || null) : null;
    if (after <= 0) { if (alert !== "out") msgs.push(`⛔ نفدت: ${p.name}`); alert = "out"; }
    else if (after <= min) { if (alert !== "low" && alert !== "out") msgs.push(`⚠️ قربت تكمل: ${p.name} — باقي ${fmtQT(p, after)}`); alert = "low"; }
    else alert = null;
    d.alert = alert;
    ops.push({t: "set", c: "inv", id: ch.pid, d, merge: true});
    if (inv) inv.qty = after, inv.alert = alert; else S.inv[ch.pid] = {qty: after, alert};
    ops.push({t: "set", c: "moves", id: uid(), d: {pid: ch.pid, name: p.name, delta: r2(ch.delta), after, reason, ref, ts: now, by: S.user.uid, byName: S.me.name}});
    // نخبّيو / نرجعو «نفدت» في الموقع وحدها
    if (after <= 0 && p.stock !== false) ops.push({t: "update", c: "products", id: p.id, d: {stock: false, autoOut: true}});
    if (after > 0 && p.stock === false && (p.autoOut || reason === "purchase" || reason === "count")) ops.push({t: "update", c: "products", id: p.id, d: {stock: true, autoOut: false}});
  }
  return {ops, msgs};
}
async function sendStockMsgs(msgs) {
  if (!msgs.length) return;
  const body = msgs.length <= 3 ? msgs.join("\n") : `${msgs.length} سلع تحتاج تشريها:\n` + msgs.slice(0, 6).join("\n") + (msgs.length > 6 ? "\n..." : "");
  await notify(msgs.some(m => m.startsWith("⛔")) ? "⛔ سلعة نفدت" : "⚠️ سلعة قربت تكمل", body, ["warning"], 4);
}

/* ملخّص كل يوم: الصلاحية + السلع القليلة */
async function dailyDigest(force=false) {
  if (!S.pro.ntfy || !S.ready.inv || !S.ready.batches) return;
  const t = todayISO(), h = new Date().getHours();
  if (!force && ((S.meta.digest || {}).day === t || h < (+S.pro.digestHour || 8) || h >= 22)) return;
  const out = S.products.filter(p => stockState(p.id) === "out"), low = S.products.filter(p => stockState(p.id) === "low");
  const exp = activeBatches().map(b => ({b, n: daysLeft(b.exp)})).filter(x => x.n <= alertWin(x.b)).sort((a, b) => a.n - b.n);
  if (!force) await DB.set("meta", "digest", {day: t, ts: Date.now(), by: S.me.name}, true);
  const lines = [];
  if (exp.length) { lines.push(`⏳ الصلاحية (${exp.length}):`); exp.slice(0, 6).forEach(x => lines.push(`• ${x.b.name} — ${leftLabel(x.n)}`)); if (exp.length > 6) lines.push("..."); }
  if (out.length) lines.push(`⛔ نفدت: ${out.slice(0, 6).map(p => p.name).join("، ")}${out.length > 6 ? "..." : ""}`);
  if (low.length) lines.push(`⚠️ قربت تكمل: ${low.slice(0, 6).map(p => p.name).join("، ")}${low.length > 6 ? "..." : ""}`);
  if (!lines.length) { if (force) await notify("Lamine Pro ✅", "كلش مليح: ما كاين حتى سلعة ناقصة ولا صلاحية قريبة.", ["white_check_mark"], 3); return; }
  await notify("📋 ملخّص اليوم — " + SHOP.name, lines.join("\n"), ["clipboard"], 4);
}

async function backfillCosts() {

  const since = Date.now() - 45 * 864e5;
  const rows = await DB.list("sales", {where: [["ts", ">=", since]]}).catch(() => []);
  for (const s of rows.filter(x => x.noCost)) {

let ZXP = null;
function zxReady() {
  if (!ZXP) ZXP = (async () => { await loadScript("zxing-reader.js"); await ZXingWASM.prepareZXingModule({overrides: {locateFile: (p, pre) => p.endsWith(".wasm") ? new URL(p, location.href).href : pre + p}, fireImmediately: true}); return ZXingWASM; })().catch(e => { ZXP = null; throw e; });
  return ZXP;
}
async function scanBarcode(cb) {
  const el = document.createElement("div"); el.className = "cam";
  el.innerHTML = `<video playsinline muted></video><div class="frame"></div><div class="line"></div><div class="tx">وجّه الكاميرا للباركود</div><div class="cl2"><button class="btn sm ghost" style="width:160px">✕ سكّر</button></div>`;
  document.body.appendChild(el);
  let stream = null, done = false, det = null;
  const stop = () => { done = true; if (stream) stream.getTracks().forEach(t => t.stop()); el.remove(); };
  $("button", el).onclick = stop;
  try { stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal: "environment"}, width: {ideal: 1280}, height: {ideal: 720}}, audio: false}); const v = $("video", el); v.srcObject = stream; await v.play(); }
  catch (e) { stop(); toast("❌ ما قدرتش نحل الكاميرا"); return; }
  if ("BarcodeDetector" in window) { try { det = new BarcodeDetector({formats: ["ean_13", "ean_8", "upc_a", "upc_e", "code_128", "code_39", "itf", "qr_code"]}); } catch (e) { det = null; } }
  const v = $("video", el), c = document.createElement("canvas");
  const loop = async () => {
    if (done) return;
    try {
      let code = null;
      if (det) { const r = await det.detect(v); if (r[0]) code = r[0].rawValue; }
      else {
        const Z = await zxReady(); const w = v.videoWidth, h = v.videoHeight; if (w) {
          c.width = w; c.height = Math.round(h * 0.4); const g = c.getContext("2d", {willReadFrequently: true}); g.drawImage(v, 0, h * 0.3, w, h * 0.4, 0, 0, w, c.height);
          const r = await Z.readBarcodes(g.getImageData(0, 0, c.width, c.height), {tryHarder: true, maxNumberOfSymbols: 1}); const x = r.find(x => x.isValid && x.text); if (x) code = x.text;
        }
      }
      if (code) { if (navigator.vibrate) navigator.vibrate(60); stop(); cb(code); return; }
    } catch (e) { console.warn(e); }
    setTimeout(loop, 120);
  };
  loop();
}

  if (typeof DEMO_BUILD !== "undefined" && !ls("lpd_user")) { ls("lpd_user", {uid: "demo-owner", email: "lamine@demo", displayName: "لمين"}); ls("lpd_config", {owner: {uid: "demo-owner", email: "lamine@demo", name: "لمين", ts: Date.now()}}); await seedDemo(); }
  if (!forceDemo) { try { await Fire.init(); DB = Fire; } catch (e) { console.error(e); DB = Demo; } }
  if ("serviceWorker" in navigator && DB === Fire) navigator.serviceWorker.register("admin-sw.js", {scope: "./admin"}).catch(() => {});
  loginScreen(`<p>... جاري التحميل</p>`);
  DB.watchDoc("settings", "shop", d => { if (!S.role) { applyShop(d || {}); } });
  DB.onUser(async u => {
    S.user = u;
    if (!u) { S.role = null; ls("lp_role", null); loginScreen(); return; }
    // يتحل ديراكت بالصلاحية المحفوظة (حتى بلا أنترنت)، ويتأكد في الخلف
    const cached = ls("lp_role");
    if (cached && cached.uid === u.uid && cached.role) {
      await new Promise(r => setTimeout(r, 0)); // نستناو باقي البرنامج يتحمّل
      S.role = cached.role; S.me = {name: cached.name || "—"};
      const h0 = location.hash.slice(1); S.tab = myTabs().some(t => t.k === h0) ? h0 : (ls("lp_openpos") ? "pos" : "home");
      if (usePin()) pinGate(cached.name); else { startData(); layout(); }
      resolveRole(u).then(r => {
        if (r.role) { ls("lp_role", {uid: u.uid, role: r.role, name: r.name}); if (r.role !== cached.role) location.reload(); }
        else if (!r.err) { ls("lp_role", null); location.reload(); }
      });
      return;
    }
    loginScreen(`<p>... نتأكدو من الحساب</p>`);
    const r = await resolveRole(u, true);
    if (r.err) return loginScreen(`<div class="note bad">ما قدرتش نوصل لقاعدة البيانات. شوف الأنترنت وعاود.</div><button class="btn" onclick="location.reload()">🔄 عاود</button>`);
    if (r.claim) return loginScreen(`<div class="note info">هاد البرنامج مازال ما عندو مول. إذا راك <b>مول المحل</b>، اضغط هنا باش تسجّل حسابك (<bdi>${esc(u.email || "")}</bdi>) كمالك. هاد الخطوة تتدار مرة وحدة برك.</div><button class="btn" onclick="claimOwner()">👑 أنا مول المحل</button>`);
    if (r.off) return loginScreen(`<div class="note bad">الحساب تاعك راهو موقّف. كلّم مول المحل.</div>`);
    if (r.none) return loginScreen(`<div class="note bad">الحساب <bdi>${esc(u.email || "")}</bdi> ما عندوش الصلاحية. قول لمول المحل يزيدك في «الإعدادات ← الخدامين».</div>`);
    S.role = r.role; S.me = {name: r.name || "—"};
    ls("lp_role", {uid: u.uid, role: r.role, name: r.name});
    if (usePin()) return pinGate(r.name);
    const h = location.hash.slice(1); S.tab = myTabs().some(t => t.k === h) ? h : (ls("lp_openpos") ? "pos" : "home");
    startData(); layout();
  });
})();

/* اقتراحات وانت تكتب */
function posMatches(q) {
  q = (q || "").trim().toLowerCase(); if (!q) return [];
  const exact = Object.keys(S.inv).filter(k => S.inv[k].barcode === q && prod(k)).map(prod);
  const words = q.split(/\s+/);
  const m = S.products.filter(p => !exact.includes(p)).map(p => { const h = (p.name + " " + (p.cat || "") + " " + ((S.inv[p.id] || {}).barcode || "")).toLowerCase(); const ok = words.every(w => h.includes(w)); return ok ? {p, s: p.name.toLowerCase().startsWith(q) ? 0 : 1} : null; }).filter(Boolean).sort((a, b) => a.s - b.s).map(x => x.p);
  return [...exact, ...m].slice(0, 8);
}
function posSuggest() {
  const box = $("#psug"); if (!box) return;
  const list = posMatches(S.ui.pq); S.ui.sugg = list;
  if (!list.length) { box.innerHTML = (S.ui.pq || "").trim() ? `<div class="sg none">ما لقيت حتى سلعة — اضغط Enter إذا هو باركود</div>` : ""; box.classList.toggle("on", !!(S.ui.pq || "").trim()); return; }
  const si = Math.min(S.ui.si || 0, list.length - 1);
  box.innerHTML = list.map((p, i) => { const st = stockState(p.id); return `<button class="sg ${i === si ? "sel" : ""}" onmousedown="event.preventDefault()" onclick="posPick('${p.id}')">${thumb(p)}<span class="t"><b>${esc(p.name)}</b><small>${fmt(p.price)} / ${esc(isKg(p) ? "كغ" : unitN(p))}</small></span>${st === "na" ? "" : st === "out" ? `<span class="pill p-bad">نفدت</span>` : `<span class="pill ${st === "low" ? "p-warn" : "p-ok"}">${fmtQ(p, qtyOf(p.id))}</span>`}</button>`; }).join("");
  box.classList.add("on");
}
function posPick(pid) { S.ui.pq = ""; S.ui.si = 0; const i = $("#pq"); if (i) i.value = ""; const b = $("#psug"); if (b) { b.innerHTML = ""; b.classList.remove("on"); } posAdd(pid); }
function posKey(e) {
  const list = S.ui.sugg || [];
  if (e.key === "ArrowDown") { e.preventDefault(); S.ui.si = Math.min((S.ui.si || 0) + 1, list.length - 1); posSuggest(); return; }
  if (e.key === "ArrowUp") { e.preventDefault(); S.ui.si = Math.max((S.ui.si || 0) - 1, 0); posSuggest(); return; }
  if (e.key === "Escape") { posPick && ($("#psug").classList.remove("on")); return; }
  if (e.key !== "Enter") return;
  e.preventDefault();
  const v = e.target.value.trim(); if (!v) { if (S.cart.length) payCash(); return; }
  const id = Object.keys(S.inv).find(k => S.inv[k].barcode === v);
  if (id && prod(id)) return posPick(id);
  if (list.length) return posPick(list[Math.min(S.ui.si || 0, list.length - 1)].id);
  posCode(v); e.target.value = ""; S.ui.pq = ""; posSuggest();
}
function posCode(code) {
  const id = Object.keys(S.inv).find(k => S.inv[k].barcode === code);
  if (id && prod(id)) { posAdd(id); toast("✅ " + prod(id).name, 1200); }
  else { toast("ما لقيتش هاد الباركود: " + code, 3000); if (isOwner()) ask(`الباركود <bdi>${esc(code)}</bdi> ما هوش مسجّل. تحب تزيد سلعة جديدة بيه؟`, () => editProduct(null, {barcode: code}), "➕ زيد", false); }
}

let SALE_BUSY = false;
async function doSale(pay, quick) {
  if (SALE_BUSY || !S.cart.length) return;
  let cid = null, cname = "", paid = cartTot();
  if (pay === "debt") {
    cid = S.ui.dc; const c = S.customers.find(x => x.id === cid);
    if (!c) { $("#derr").textContent = "اختار الزبون"; return; }
    cname = c.name; paid = Math.min(num($("#dpaid").value), cartTot());
  }
  SALE_BUSY = true; const btn = $("#pbtn"); if (btn) btn.disabled = true;
  const own = isOwner(), now = Date.now(), id = uid(), code = String(now).slice(-6);
  const items = S.cart.map(i => ({pid: i.pid, name: i.name, unit: i.unit, unitName: i.unitName || "", qty: r2(i.qty), price: r2(i.price), total: r2(i.qty * i.price), ...(own ? {cost: costOf(i.pid)} : {})}));
  const sub = cartSub(), disc = +S.ui.disc || 0, total = cartTot();
  const sale = {code, ts: now, day: todayISO(), by: S.user.uid, byName: S.me.name, items, sub, disc, total, pay, paid: r2(paid)};
  if (cid) Object.assign(sale, {cid, cname});
  if (own) { const cost = r2(items.reduce((a, i) => a + i.cost * i.qty, 0)); Object.assign(sale, {cost, profit: r2(total - cost)}); } else sale.noCost = true;
  const {ops, msgs} = stockOps(items.map(i => ({pid: i.pid, delta: -i.qty})), "sale", code);
  ops.unshift({t: "set", c: "sales", id, d: sale});
  if (pay === "debt") {
    const debt = r2(total - paid);
    if (debt > 0) {
      ops.push({t: "set", c: "debtTx", id: uid(), d: {cid, ts: now, type: "debt", amount: debt, saleId: id, note: `بيعة #${code}`, by: S.me.name}});
      ops.push({t: "update", c: "customers", id: cid, d: {bal: DB.inc(debt), lastTs: now}});
    }
  }
  try { await commitFast(ops, "sale"); }
  catch (e) { SALE_BUSY = false; if (btn) btn.disabled = false; return; }
  if (!own) { const my = ls(myDayKey()) || {n: 0, t: 0}; ls(myDayKey(), {n: my.n + 1, t: my.t + total}); }
  S.cart = []; S.ui.disc = 0; S.ui.cust = null; saveCart(); SALE_BUSY = false;
  if (quick) { // ديراكت: يطبع (إذا «بيع + طباعة») بلا ما يحل نافذة، والبون الجديد واجد
    closeModal(); toast(`✅ تسجّلت البيعة #${code} · ${fmt(total)}`, 2500);
    if (S.ui.autoPrint) printTicket({id, ...sale});
  } else showTicket({id, ...sale}, true, S.ui.autoPrint);
  S.ui.autoPrint = false;
  if ($("#pd")) drawPD();
  if (S.tab === "pos") VIEWS.pos.draw();
  sendStockMsgs(msgs);
}

async function saveAdjust(pid) {
  const p = prod(pid), v = num($("#aq").value), mode = qtyOf(pid) == null ? "set" : S.ui.adj;
  if (!(v >= 0) || ($("#aq").value.trim() === "")) return toast("اكتب الكمية");
  const cur = qtyOf(pid) || 0;
  const delta = mode === "in" ? v : mode === "out" ? -v : r2(v - cur);
  if (!delta && mode !== "set") return toast("الكمية 0");
  const {ops, msgs} = stockOps([{pid, delta, create: true}], mode === "set" ? "count" : mode === "out" ? "loss" : "adjust", ($("#an").value || "").trim().slice(0, 40));
  await commitFast(ops, "adjust"); toast("✅ تسجّل: " + fmtQT(p, qtyOf(pid))); closeModal(); sendStockMsgs(msgs);
}
async function saveStockMeta(pid) {
  const d = {barcode: $("#abc").value.trim(), updatedAt: Date.now()};
  const m = $("#amin").value.trim(); d.min = m === "" ? null : num(m);
  if (d.barcode) { const dup = Object.keys(S.inv).find(k => k !== pid && S.inv[k].barcode === d.barcode); if (dup && prod(dup)) return toast("هاد الباركود مسجّل لـ: " + prod(dup).name, 3500); }
  const ops = [{t: "set", c: "inv", id: pid, d, merge: true}];
  if ($("#acost")) ops.push({t: "set", c: "costs", id: pid, d: {cost: num($("#acost").value), ts: Date.now()}, merge: true});
  await commitFast(ops, "meta"); toast("✅ تحفظت"); closeModal();
}

function uSync() {

function pickImg(inp) {
  const f = inp.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = () => { const im = new Image(); im.onload = () => {
    const M = 640, s = Math.min(1, M / Math.max(im.width, im.height)), c = document.createElement("canvas");
    c.width = Math.round(im.width * s); c.height = Math.round(im.height * s); c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
    EP.img = c.toDataURL("image/jpeg", 0.72); $("#e_prev").innerHTML = `<img class="th" style="width:84px;height:84px;border-radius:16px;object-fit:cover" src="${EP.img}">`;
  }; im.src = r.result; }; r.readAsDataURL(f);
}
async function saveProd(isEdit) {
  EP.name = $("#e_name").value.trim(); EP.cat = $("#e_cat").value.trim(); EP.price = num($("#e_price").value);
  EP.unitName = EP.unit === "kg" ? "" : ($("#e_unit").value.trim() || "حبة"); EP.desc = $("#e_desc").value.trim();
  if (!EP.name) return $("#e_err").textContent = "اكتب اسم السلعة";
  if (!(EP.price > 0)) return $("#e_err").textContent = "اكتب سعر البيع";
  const bc = $("#e_bc").value.trim();
  if (bc) { const dup = Object.keys(S.inv).find(k => k !== EP.id && S.inv[k].barcode === bc); if (dup && prod(dup)) return $("#e_err").textContent = "هاد الباركود مسجّل لـ: " + prod(dup).name; }
  EP.ts = EP.ts || Date.now();
  const {id, ...d} = EP, ops = [{t: "set", c: "products", id, d}];
  const minS = $("#e_min").value.trim(), invD = {barcode: bc, min: minS === "" ? null : num(minS), updatedAt: Date.now()};
  const costS = $("#e_cost").value.trim(); if (costS !== "") ops.push({t: "set", c: "costs", id, d: {cost: num(costS), ts: Date.now()}, merge: true});
  const qEl = $("#e_qty"), qS = qEl ? qEl.value.trim() : "";
  $("#e_save").disabled = true;
  // نحفظو السلعة قبل باش stockOps يلقاها
  if (!prod(id)) S.products.push(EP);
  if (qS !== "") {
    ops.push({t: "set", c: "inv", id, d: invD, merge: true});
    const so = stockOps([{pid: id, delta: num(qS) - (qtyOf(id) || 0), create: true}], "count", "بداية");
    ops.push(...so.ops.filter(o => o.c !== "products"));
    if (num(qS) <= 0) d.stock = false;
  } else ops.push({t: "set", c: "inv", id, d: S.inv[id] ? invD : invD.barcode || invD.min != null ? {...invD} : invD, merge: true});
  // إذا ما كتبش الكمية وما كانش متبعة: ما نديروش inv بكمية (يبقى «ما هيش متبعة»)
  if (qS === "" && !S.inv[id] && !invD.barcode && invD.min == null) ops.splice(ops.findIndex(o => o.c === "inv"), 1);
  try { await commitFast(ops, "product"); closeModal(); toast("✅ تحفظت السلعة"); }
  catch (e) { $("#e_err").textContent = "ما تحفظتش (الصلاحيات ولا حجم الصورة)"; $("#e_save").disabled = false; }
}
async function delProduct(id) {

}

async function importSalahiti() {
  const f = await pickFile("application/json,.json"); if (!f) return;
  try {
    const j = JSON.parse(await f.text()); if (!Array.isArray(j.items)) throw 0;
    const ops = [];
    for (const it of j.items.filter(x => !x.done && x.exp)) {
      const pidB = it.barcode && Object.keys(S.inv).find(k => S.inv[k].barcode === it.barcode);
      const pid = pidB || ((S.products.find(p => p.name === it.name) || {}).id) || "";
      ops.push({t: "set", c: "batches", id: "sl_" + it.id, d: {pid, name: it.name || "سلعة", barcode: it.barcode || "", exp: it.exp, qty: it.qty != null ? String(it.qty) : "", alerts: it.alerts || [30, 7, 1], note: it.note || "", done: false, ts: it.created || Date.now(), by: "صلاحيتي", src: "salahiti"}});
    }
    if (!ops.length) return toast("ما لقيت حتى سلعة في الملف");
    for (let i = 0; i < ops.length; i += 400) await commitFast(ops.slice(i, i + 400), "import");

async function setStatus(id, s) {
  const o = S.orders.find(x => x.id === id); if (!o) return;
  const ops = [{t: "update", c: "orders", id, d: {status: s, [s + "At"]: Date.now()}}];
  let msgs = [];
  const items = (o.items || []).filter(i => i.pid);
  if (["conf", "ship", "done"].includes(s) && !o.stockApplied) { const r = stockOps(items.map(i => ({pid: i.pid, delta: -oQty(i)})), "order", o.code); ops.push(...r.ops); msgs = r.msgs; ops[0].d.stockApplied = true; }
  if (s === "cancel" && o.stockApplied) { const r = stockOps(items.map(i => ({pid: i.pid, delta: +oQty(i)})), "return", o.code); ops.push(...r.ops); ops[0].d.stockApplied = false; }
  if (s === "done") {  // الطلبية المستلمة تدخل في المبيعات والربح
    const own = isOwner(), its = (o.items || []).map(i => ({pid: i.pid || "", name: i.name, unit: i.unit === "kg" ? "kg" : "piece", unitName: i.unitName || "", qty: oQty(i), price: r2(i.total / (oQty(i) || 1)), total: +i.total || 0, ...(own ? {cost: costOf(i.pid)} : {})}));
    const sale = {code: "W" + o.code, ts: Date.now(), day: todayISO(), by: S.user.uid, byName: S.me.name, items: its, sub: +o.total || 0, disc: 0, total: +o.total || 0, pay: "order", paid: +o.total || 0, cname: `${(o.customer || {}).first || ""} ${(o.customer || {}).last || ""}`.trim(), orderId: o.id};
    if (own) { const cost = r2(its.reduce((a, i) => a + (i.cost || 0) * i.qty, 0)); Object.assign(sale, {cost, profit: r2(sale.total - cost)}); } else sale.noCost = true;
    ops.push({t: "set", c: "sales", id: "o_" + o.id, d: sale});
  }
  try { await commitFast(ops, "order"); toast("تبدّلت الحالة: " + STATUS[s]); sendStockMsgs(msgs); } catch (e) {}
}

async function savePurchase() {
  plKeep();
  const lines = PL.lines.filter(l => num(l.qty) > 0);
  if (!lines.length) return $("#pl_e").textContent = "زيد سلعة وكتب الكمية";
  $("#pl_go").disabled = true;
  const now = Date.now(), id = uid(), code = String(now).slice(-6), sup = S.suppliers.find(s => s.id === PL.sid);
  const items = lines.map(l => ({pid: l.pid, name: l.name, qty: r2(num(l.qty)), cost: r2(num(l.cost)), exp: l.exp || "", total: r2(num(l.qty) * num(l.cost))}));
  const total = r2(items.reduce((a, i) => a + i.total, 0)), paid = PL.paid === "" ? total : Math.min(total, num(PL.paid));
  const ops = [{t: "set", c: "purchases", id, d: {code, ts: now, sid: PL.sid || "", sname: sup ? sup.name : "", items, total, paid, note: PL.note || "", by: S.me.name}}];
  for (const it of items) {   // متوسط سعر الشراء
    const oldQ = Math.max(0, qtyOf(it.pid) || 0), oldC = costOf(it.pid);
    const nc = it.cost > 0 ? r2((oldQ * oldC + it.qty * it.cost) / (oldQ + it.qty || 1)) : oldC;
    ops.push({t: "set", c: "costs", id: it.pid, d: {cost: nc, last: it.cost, ts: now}, merge: true});
    if (S.costs[it.pid]) S.costs[it.pid].cost = nc; else S.costs[it.pid] = {cost: nc};
    const l = lines.find(x => x.pid === it.pid);
    if (l.price !== "" && num(l.price) > 0) ops.push({t: "update", c: "products", id: it.pid, d: {price: num(l.price)}});
    if (it.exp) ops.push({t: "set", c: "batches", id: uid(), d: {pid: it.pid, name: it.name, barcode: (S.inv[it.pid] || {}).barcode || "", exp: it.exp, qty: String(it.qty), alerts: [...(S.pro.alertDays || [30, 7, 1])], note: sup ? "من " + sup.name : "", done: false, ts: now, by: S.me.name}});
  }
  const so = stockOps(items.map(i => ({pid: i.pid, delta: i.qty, create: true})), "purchase", code); ops.push(...so.ops);
  if (PL.sid) {
    ops.push({t: "set", c: "supTx", id: uid(), d: {sid: PL.sid, ts: now, type: "buy", amount: total, note: `شراء #${code}`}});
    if (paid > 0) ops.push({t: "set", c: "supTx", id: uid(), d: {sid: PL.sid, ts: now + 1, type: "pay", amount: paid, note: `مع الشراء #${code}`}});
    ops.push({t: "update", c: "suppliers", id: PL.sid, d: {bal: DB.inc(r2(total - paid)), lastTs: now}});
  }
  try { await commitFast(ops, "purchase"); closeModal(); toast(`✅ تسجّل الشراء (${items.length} سلعة) ودخلت للمخزون`); loadPurch(); }
  catch (e) { $("#pl_go").disabled = false; }
}

function rRange() {

  if (k === "7") return [dayStart() - 6 * 864e5, Date.now() + 1, "آخر 7 أيام"];
  if (k === "30") return [dayStart() - 29 * 864e5, Date.now() + 1, "آخر 30 يوم"];
  if (k === "month") return [new Date(n.getFullYear(), n.getMonth(), 1).getTime(), Date.now() + 1, "هاد الشهر"];
  if (k === "last") return [new Date(n.getFullYear(), n.getMonth() - 1, 1).getTime(), new Date(n.getFullYear(), n.getMonth(), 1).getTime(), "الشهر الفايت"];
  if (k === "year") return [new Date(n.getFullYear(), 0, 1).getTime(), Date.now() + 1, "هاد العام"];
  return [dayStart() - 6 * 864e5, Date.now() + 1, "آخر 7 أيام"];
}

function pickLogo(inp) {
  const f = inp.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = () => { const im = new Image(); im.onload = () => {
    const M = 300, sc = Math.min(1, M / Math.max(im.width, im.height)), c = document.createElement("canvas");
    c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc); c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
    ES.logo = c.toDataURL("image/png"); if (ES.logo.length > 250000) ES.logo = c.toDataURL("image/jpeg", 0.85); $("#s_prev").src = ES.logo;
  }; im.src = r.result; }; r.readAsDataURL(f);
}

  drawPDGrid();
}
function pdQ(i, d) { const it = S.cart[i]; if (!it) return; it.qty = r2(it.qty + d); if (it.qty <= 0) S.cart.splice(i, 1); S.ui.sel = Math.min(i, S.cart.length - 1); saveCart(); drawPD(); posFocus(); }
function drawPDGrid() {
  const cats = [...new Set(S.products.map(p => p.cat).filter(Boolean))];
  const favs = S.products.filter(p => (S.inv[p.id] || {}).fav);
  const G = [["fav", "⭐ المفضلات", favs.length], ...cats.map(c => [c, c, S.products.filter(p => p.cat === c).length]), ["all", "📦 كل السلع", S.products.length]];
  if (!S.ui.pg) S.ui.pg = favs.length ? "fav" : "all";
  $("#pdgroups").innerHTML = G.map(([k, l, n]) => `<button class="${S.ui.pg === k ? "on" : ""}" data-k="${esc(k)}" onclick="S.ui.pg=this.dataset.k;drawPDGrid();posFocus()"><b>${esc(l)}</b><small>${n} سلعة</small></button>`).join("");
  const list = S.ui.pg === "fav" ? favs : S.ui.pg === "all" ? S.products : S.products.filter(p => p.cat === S.ui.pg);
  $("#pdtiles").innerHTML = list.length ? list.map(p => { const st = stockState(p.id); return `<button class="pt ${st === "out" ? "out" : ""}" onclick="posAdd('${p.id}');posFocus()">${p.img ? `<img src="${p.img}" alt="">` : ""}<b>${esc(p.name)}</b><span>${fmt(p.price)}${isKg(p) ? " /كغ" : ""}</span>${st === "low" ? `<i class="pill p-warn">باقي ${fmtQ(p, qtyOf(p.id))}</i>` : st === "out" ? `<i class="pill p-bad">نفدت</i>` : ""}</button>`; }).join("")
    : `<div class="pd-empty" style="grid-column:1/-1">${S.ui.pg === "fav" ? "⭐ ما زدت حتى سلعة للمفضلات.<br><small>من «المخزون» حل السلعة واضغط «⭐ زيدها للمفضلات» (السلع اللي تتباع بالميزان ولا بلا باركود)</small>" : "ما كاين حتى سلعة"}</div>`;
}
function pdDisc() {
  if (S.ui.mult) { S.ui.disc = num(S.ui.mult); S.ui.mult = ""; drawPD(); posFocus(); return; }
  modal(`<h2>تخفيض على البون<button class="x" onclick="closeModal()">×</button></h2><label class="f">شحال تنقص (دج)</label><input class="in" id="dd" inputmode="numeric" value="${S.ui.disc || ""}" onkeydown="if(event.key==='Enter')$('#ddo').click()">
    <div style="height:12px"></div><button class="btn" id="ddo" onclick="S.ui.disc=num($('#dd').value);closeModal();drawPD();posFocus()">✔️ حفظ</button>`);
  setTimeout(() => $("#dd") && $("#dd").focus(), 60);
}
/* الأزرار */
function pdAct(k) {
  const i = S.ui.sel, it = S.cart[i];
  if (k === "sell" || k === "sellp") {
    if (!S.cart.length) return toast("البون فارغ");
    S.ui.autoPrint = k === "sellp";
    // كيما سهلها: البيعة تتسجّل ديراكت نقداً (بلا «شحال عطاك»)، والكريدي/الناقص بزر «كريدي / ناقص»
    if (S.ui.cust && isOwner()) { payDebt(); S.ui.dc = S.ui.cust; drawDc(); } else doSale("cash", true);
    return;
  }
  if (k === "new") { if (S.cart.length) holdTicket(true); S.ui.cust = null; drawPD(); posFocus(); return; }
  if (k === "hold") { if (!S.cart.length) return toast("البون فارغ"); holdTicket(); return; }
  if (k === "cancel") { if (!S.cart.length) return; return ask("تلغي هاد البون؟", () => { S.cart = []; S.ui.disc = 0; S.ui.cust = null; saveCart(); drawPD(); posFocus(); }, "إيه، ألغيه"); }
  if (k === "cust") return chooseCust();
  if (k === "debt") { if (!S.cart.length) return toast("البون فارغ"); S.ui.autoPrint = true; return payDebt(); }
  if (k === "ret") return openDaySales("ret");
  if (k === "list") return openDaySales("list");
  if (k === "exit") { clearInterval(PD_CLOCK); return go("home"); } // خروج من الكاسة ← الرئيسية (فيها الإعدادات والقفل)
  if (k === "qty") { if (!it) return toast("اختار سطر"); const v = takeMult(); if (v == null) return toast("اكتب الكمية في الأرقام من بعد اضغط «الكمية»"); it.qty = it.unit === "kg" ? r2(v >= 20 ? v / 1000 : v) : v; saveCart(); drawPD(); posFocus(); return; }
  if (k === "price") { if (!it) return toast("اختار سطر"); const v = takeMult(); if (v == null) return cartPrice(i); it.price = v; saveCart(); drawPD(); posFocus(); return; }
  if (k === "del") { if (!it) return; S.cart.splice(i, 1); S.ui.sel = Math.min(i, S.cart.length - 1); saveCart(); drawPD(); posFocus(); }
}
function holdTicket(silent) {
  const h = held(), n = (ls("lp_heldn") || 0) + 1; ls("lp_heldn", n > 99 ? 1 : n);
  h.push({id: uid(), n, ts: Date.now(), cart: S.cart, disc: S.ui.disc || 0, cust: S.ui.cust || null}); saveHeld(h);
  S.cart = []; S.ui.disc = 0; S.ui.cust = null; saveCart();
  if (!silent) toast(`⏸️ تعلّق البون ${n}`);
  drawCart(); posFocus();
}
function resumeHeld(id) {
  let h = held(); const x = h.find(t => t.id === id); if (!x) return;
  h = h.filter(t => t.id !== id); saveHeld(h);
  if (S.cart.length) holdTicket(true);
  S.cart = x.cart; S.ui.disc = x.disc || 0; S.ui.cust = x.cust || null; S.ui.sel = S.cart.length - 1; saveCart(); drawCart(); posFocus();
}
function chooseCust() {
  if (!isOwner()) return toast("الكريدي غير لمول المحل");
  modal(`<h2>👤 اختار الزبون<button class="x" onclick="closeModal();posFocus()">×</button></h2>
    <div class="search"><input id="ccq" placeholder="ابحث على الزبون..." oninput="drawCc()" onkeydown="if(event.key==='Enter'){const b=$('#ccl .it');b&&b.click()}"><button onclick="newCustomer(c=>{S.ui.cust=c.id;closeModal();drawPD();posFocus()})">➕</button></div>
    <div id="ccl" class="list" style="max-height:50vh;overflow:auto"></div>`);
  drawCc(); setTimeout(() => $("#ccq") && $("#ccq").focus(), 60);
}
function drawCc() {
  const q = (($("#ccq") || {}).value || "").trim().toLowerCase();
  $("#ccl").innerHTML = S.customers.filter(c => !q || (c.name + " " + (c.phone || "")).toLowerCase().includes(q)).slice(0, 40).map(c => `<div class="it" onclick="S.ui.cust='${c.id}';closeModal();drawPD();posFocus()"><div class="th">👤</div><div class="t"><b>${esc(c.name)}</b><small><bdi>${esc(c.phone || "")}</bdi></small></div><div class="e"><small>عليه</small><b>${fmt(c.bal || 0)}</b></div></div>`).join("") || `<div class="empty" style="padding:16px">ما كاين حتى زبون — اضغط ➕</div>`;
}
function openDaySales(mode) {
  if (!isOwner()) return toast("غير مول المحل");
  const list = [...S.salesToday].sort((a, b) => b.ts - a.ts);
  modal(`<h2>${mode === "ret" ? "↩️ استرجاع: اختار البيعة" : "📋 بيعات اليوم"}<button class="x" onclick="closeModal();posFocus()">×</button></h2>
    ${mode === "ret" ? `<div class="note">اختار البيعة، من بعد اضغط «إلغاء البيعة». السلعة ترجع للمخزون${""}.</div>` : `<div class="kpis" style="grid-template-columns:1fr 1fr"><div class="kpi dark"><small>المجموع</small><b>${fmt(list.reduce((a, s) => a + (s.total || 0), 0))}</b></div><div class="kpi"><small>عدد البيعات</small><b><bdi>${list.length}</bdi></b></div></div>`}
    <div class="list" style="max-height:60vh;overflow:auto">${list.length ? list.map(saleRow).join("") : `<div class="empty">ما كاين حتى بيعة اليوم</div>`}</div>`);
}

/* أزرار الكلافيي (كيما سهلها) */
document.addEventListener("keydown", e => {
  if (!S.role) return;
  const k = e.key;
  if (S.tab === "pos" && $("#pd")) {
    if ($("#ov")) { if (k === "Escape") { closeModal(); posFocus(); } return; }
    const map = {F2: "new", F3: "qty", F4: "price", F5: "ret", F6: "debt", F7: "list", F8: "hold", F9: "exit", F10: "cancel", F11: "sell", F12: "sellp"};
    if (map[k]) { e.preventDefault(); pdAct(map[k]); return; }
    const inInput = document.activeElement && document.activeElement.id === "pq";
    if (k === "Delete" && (!inInput || !e.target.value)) { e.preventDefault(); pdAct("del"); return; }
    if ((k === "ArrowUp" || k === "ArrowDown") && !(S.ui.sugg || []).length) { e.preventDefault(); const n = S.cart.length; if (!n) return; S.ui.sel = Math.max(0, Math.min(n - 1, (S.ui.sel ?? n - 1) + (k === "ArrowUp" ? -1 : 1))); drawPD(); return; }
    if (k === "*" && inInput) { const v = e.target.value.trim(); if (/^\d+([.,]\d+)?$/.test(v)) { e.preventDefault(); S.ui.mult = v.replace(",", "."); e.target.value = ""; S.ui.pq = ""; kpShow(); posSuggest(); } return; }
    return;
  }
  if ($("#ov") || !posDesk() || /INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || "")) return;
  const g = {F1: "pos", F3: "stock", F8: "exp"}; const go2 = isOwner() ? {F2: "buy", F4: "reports", F5: "debts", F6: "buy"} : {};
  if (g[k] || go2[k]) { e.preventDefault(); go(g[k] || go2[k]); if (k === "F2") setTimeout(newPurchase, 60); if (k === "F6") { S.ui.bt = "sup"; renderPage(); } }
});
let PD_W = posDesk();
window.addEventListener("resize", () => { const w = posDesk(); if (w !== PD_W) { PD_W = w; if (S.tab === "pos") layout(); } });

/* ============================================================
   🔐 الدخول بالكود (كيما سهلها): المدير، الأدمن، العامل
   الجهاز يبقى داخل بحساب Google تاع مول المحل، وكل واحد يدخل بالكود تاعو.
   ============================================================ */
const LVL = {manager: "👑 المدير", admin: "🛡️ الأدمن", worker: "🧑‍🔧 العامل"};
async function pinHash(pin) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("lamine-pro:" + pin));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
}
const lockOn = () => ls("lp_lock") !== false;
let PIN_LIST = [], PIN_BUF = "", PIN_DONE = null, PIN_CLOCK = null;

// يتنادى كي يدخل مول المحل بحساب Google
async function pinGate(name) {
  const pro = await (DB.getFast ? DB.getFast("settings", "pro") : DB.get("settings", "pro")).catch(() => null);
  PIN_LIST = (pro && pro.pins) || [];
  if (!PIN_LIST.length) return pinSetup(name);
  const sid = sessionStorage.getItem("lp_pin");
  const p = sid && PIN_LIST.find(x => x.id === sid);
  if (p) return pinEnter(p);
  pinLock();
}
function pinEnter(p) {
  sessionStorage.setItem("lp_pin", p.id);
  S.lvl = p.role; S.role = p.role === "worker" ? "worker" : "owner"; S.me = {name: p.name};
  clearInterval(PIN_CLOCK);
  const h = location.hash.slice(1); S.tab = myTabs().some(t => t.k === h) ? h : (ls("lp_openpos") ? "pos" : "home");
  startData(); layout();
}
function pinLogout() { sessionStorage.removeItem("lp_pin"); location.hash = ""; location.reload(); }

function pinScreen(title, sub, onDone) {
  PIN_BUF = ""; PIN_DONE = onDone; clearInterval(PIN_CLOCK);
  const k = n => `<button class="pk" onclick="pinKey('${n}')">${n === "del" ? "⌫" : n === "ok" ? "✓" : n}</button>`;
  $("#app").innerHTML = `<div class="login pinlog"><img src="${LOGO}" alt=""><h1>${esc(SHOP.name || "Lamine Pro")}</h1>
    <div class="pclock" id="pclock"></div>
    <p style="margin:6px 0 2px"><b>${title}</b></p>${sub ? `<p class="muted" style="margin:0 0 6px;font-size:14px">${sub}</p>` : ""}
    <div class="pdots" id="pdots"></div><div class="perr" id="perr"></div>
    <div class="ppad">${["1","2","3","4","5","6","7","8","9","del","0","ok"].map(k).join("")}</div>
    <p class="muted" style="font-size:13px;margin-top:14px">Lamine Pro · النسخة ${APP_VERSION}</p></div>`;
  const tick = () => { const c = $("#pclock"); if (!c) return clearInterval(PIN_CLOCK); const d = new Date(); c.textContent = d.toLocaleDateString("ar-DZ", {weekday: "long", day: "numeric", month: "long"}) + " · " + d.toLocaleTimeString("fr-FR", {hour: "2-digit", minute: "2-digit"}); };
  tick(); PIN_CLOCK = setInterval(tick, 15000); pinDraw();
}
function pinDraw() { const d = $("#pdots"); if (d) d.innerHTML = PIN_BUF.length ? "●".repeat(PIN_BUF.length) : `<span class="muted">— — — —</span>`; }
function pinKey(k) {
  const e = $("#perr"); if (e) e.textContent = "";
  if (k === "del") PIN_BUF = PIN_BUF.slice(0, -1);
  else if (k === "ok") { if (PIN_BUF.length >= 4 && PIN_DONE) PIN_DONE(PIN_BUF); else if (e) e.textContent = "الكود لازم 4 أرقام ولا كثر"; return; }
  else if (PIN_BUF.length < 8) PIN_BUF += k;
  pinDraw();
}
document.addEventListener("keydown", e => {
  if (!$("#pdots")) return;
  if (/^[0-9]$/.test(e.key)) { pinKey(e.key); e.preventDefault(); }
  else if (e.key === "Backspace") { pinKey("del"); e.preventDefault(); }
  else if (e.key === "Enter") { pinKey("ok"); e.preventDefault(); }
});
function pinLock() {
  pinScreen("🔐 اكتب الكود تاعك", "", async code => {
    const h = await pinHash(code), p = PIN_LIST.find(x => x.h === h);
    if (p) return pinEnter(p);
    PIN_BUF = ""; pinDraw(); const e = $("#perr"); if (e) e.textContent = "❌ الكود غالط";
  });
}
function pinSetup(name) {
  pinScreen("👑 اختار كود المدير", "4 أرقام ولا كثر، هو اللي تدخل بيه كل مرة", first => {
    pinScreen("🔁 عاود اكتب نفس الكود", "", async again => {
      if (again !== first) { toast("❌ الكودين ماشي كيف كيف، عاود"); return pinSetup(name); }
      const p = {id: uid(), name: name || "المدير", role: "manager", h: await pinHash(first), ts: Date.now()};
      try { await commitFast([{t: "set", c: "settings", id: "pro", d: {pins: [p]}, merge: true}]); } catch (e) { return toast("❌ ما تسجّلش: " + (e.code || e.message), 5000); }
      PIN_LIST = [p]; toast("✅ تسجّل كود المدير"); pinEnter(p);
    });
  });
}

// ===== الإعدادات: الكودات =====
function openPins() {
  const pins = (S.pro && S.pro.pins) || PIN_LIST || [];
  modal(`<h2>🔐 الكودات</h2>
    <p class="muted" style="margin-top:0">كل واحد يدخل بالكود تاعو. <b>المدير</b> يشوف كلش. <b>الأدمن</b> كلش غير التقارير والأرباح والكودات. <b>العامل</b> الكاسة والمخزون والطلبيات برك (بلا أرباح ولا ديون).</p>
    <div class="list">${pins.map(p => `<div class="it"><div class="th">${LVL[p.role].split(" ")[0]}</div><div class="t"><b>${esc(p.name)}</b><small>${LVL[p.role]}</small></div>
      <button class="btn ghost sm" onclick="delPin('${p.id}')">حذف</button></div>`).join("")}</div>
    <h3 style="margin:14px 0 6px">➕ زيد واحد</h3>
    <label class="f">الاسم</label><input class="in" id="pn_name" placeholder="مثلاً: ياسين">
    <label class="f">الدور</label><select class="in" id="pn_role"><option value="worker">🧑‍🔧 العامل</option><option value="admin">🛡️ الأدمن</option><option value="manager">👑 المدير</option></select>
    <label class="f">الكود (4 أرقام ولا كثر)</label><input class="in" id="pn_code" inputmode="numeric" maxlength="8" dir="ltr" placeholder="••••">
    <div class="bonacts"><button class="btn" onclick="addPin()">✅ سجّل</button><button class="btn ghost" onclick="closeModal()">إغلاق</button></div>`);
}
async function addPin() {
  const name = $("#pn_name").value.trim(), role = $("#pn_role").value, code = $("#pn_code").value.trim();
  if (!name) return toast("اكتب الاسم");
  if (!/^\d{4,8}$/.test(code)) return toast("الكود لازم 4 حتى 8 أرقام");
  const pins = [...((S.pro && S.pro.pins) || PIN_LIST || [])], h = await pinHash(code);
  if (pins.some(p => p.h === h)) return toast("هاد الكود مستعمل، اختار واحد آخر");
  pins.push({id: uid(), name, role, h, ts: Date.now()});
  try { await commitFast([{t: "set", c: "settings", id: "pro", d: {pins}, merge: true}]); } catch (e) { return toast("❌ " + (e.code || e.message)); }
  S.pro.pins = pins; PIN_LIST = pins; toast("✅ تسجّل " + name); openPins();
}
function delPin(id) {
  const pins = (S.pro && S.pro.pins) || [];
  const p = pins.find(x => x.id === id); if (!p) return;
  if (p.role === "manager" && pins.filter(x => x.role === "manager").length < 2) return toast("لازم يبقى مدير واحد على الأقل");
  ask(`نحذفو الكود تاع ${esc(p.name)}؟`, async () => {
    const rest = pins.filter(x => x.id !== id);
    try { await commitFast([{t: "set", c: "settings", id: "pro", d: {pins: rest}, merge: true}]); } catch (e) { return toast("❌ " + (e.code || e.message)); }
    S.pro.pins = rest; PIN_LIST = rest; toast("تحذف"); openPins();
  }, "حذف");
}

</script>
</body>
