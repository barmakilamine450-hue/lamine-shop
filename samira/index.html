<style>
:root{--p:#6B2E8F;--pd:#45175F;--pl:#B993D6;--pll:#F3EAFA;--bg:#FBF7FD;--gold:#C9A24B;--ink:#2A1638;--mut:#7D6B8A;--ok:#1E9E5A;--sh:0 10px 30px rgba(74,29,102,.12);--dh:34px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif}
body{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:150px;background:var(--bg);box-shadow:0 0 60px rgba(74,29,102,.06)}
button,input,select,textarea{font-family:inherit}
.demo{position:sticky;top:0;z-index:40;background:linear-gradient(90deg,var(--gold),#E2C27A);color:#3B2A08;text-align:center;font-size:13px;font-weight:800;padding:8px 10px}
.hero{position:relative;margin:0 0 6px;padding:26px 18px 22px;text-align:center;background:radial-gradient(circle at 50% 0,#fff 0,var(--pll) 55%,#EBDDF6 100%);border-radius:0 0 34px 34px;overflow:hidden}
.hero:before,.hero:after{content:"🦋";position:absolute;font-size:34px;opacity:.35}
.hero:before{top:18px;right:22px;transform:rotate(-18deg)}.hero:after{top:120px;left:20px;transform:rotate(16deg) scale(.8)}
.hero .lg{width:128px;height:128px;border-radius:50%;box-shadow:0 0 0 5px #fff,0 0 0 8px var(--gold),var(--sh);background:#fff}
.hero h1{margin:14px 0 2px;font-size:30px;font-weight:900;color:var(--pd);line-height:1.2}
.hero h1 span{font-family:"Great Vibes",cursive;font-weight:400;font-size:46px;color:var(--p);display:block;line-height:1}
.hero p{margin:6px 0 12px;color:var(--mut);font-size:15px;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px}
.chips span{background:#fff;border-radius:30px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--pd);box-shadow:0 3px 10px rgba(74,29,102,.08)}
.cta{display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:16px;padding:15px 14px;font-size:16px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;box-shadow:0 8px 20px rgba(107,46,143,.3);display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;width:100%}
.btn.gh{background:#fff;color:var(--pd);box-shadow:0 3px 12px rgba(74,29,102,.1)}
.btn.wa{background:linear-gradient(135deg,#25D366,#128C4A);box-shadow:0 8px 20px rgba(37,211,102,.3)}
.btn.sm{padding:10px 12px;font-size:14px;border-radius:12px}
.btn:active{transform:scale(.98)}
.sec{padding:18px 16px 4px}
.sec h2{margin:0 0 12px;font-size:21px;font-weight:900;color:var(--pd);display:flex;align-items:center;gap:8px}
.sec h2 small{font-size:13px;color:var(--mut);font-weight:600;margin-right:auto}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.step{background:#fff;border-radius:18px;padding:14px 8px;text-align:center;box-shadow:var(--sh)}
.step i{display:flex;align-items:center;justify-content:center;width:46px;height:46px;margin:0 auto 6px;border-radius:50%;background:var(--pll);font-style:normal;font-size:22px}
.step b{display:block;font-size:14px}.step small{color:var(--mut);font-size:12px}
.gal{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x mandatory}
.gal img{width:170px;height:170px;object-fit:cover;border-radius:18px;flex:none;scroll-snap-align:start;box-shadow:var(--sh)}
.cats{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px}
.cats button{flex:none;border:0;border-radius:30px;padding:9px 16px;font-size:14px;font-weight:800;background:#fff;color:var(--pd);box-shadow:0 3px 10px rgba(74,29,102,.08);cursor:pointer}
.cats button.on{background:var(--p);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column;cursor:pointer}
.card .im{aspect-ratio:1;background:linear-gradient(135deg,var(--pll),#E2CFF2);display:flex;align-items:center;justify-content:center;font-size:64px;position:relative}
.card .im img{width:100%;height:100%;object-fit:cover}
.card .im .off{position:absolute;inset:0;background:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:#B23A48}
.card .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.card b{font-size:15px;line-height:1.35}
.card small{color:var(--mut);font-size:12.5px;line-height:1.45}
.price{margin-top:auto;padding-top:6px;font-weight:900;color:var(--p);font-size:14px}
.price.q{color:var(--gold)}
.cartbar{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);width:min(528px,calc(100% - 24px));z-index:30;display:none}
.cartbar.on{display:block}
.cartbar button{width:100%;border:0;border-radius:20px;padding:15px 18px;background:var(--ink);color:#fff;font-size:16px;font-weight:800;display:flex;align-items:center;gap:10px;box-shadow:0 12px 30px rgba(42,22,56,.35);cursor:pointer}
.cartbar .n{background:var(--gold);color:#3B2A08;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center}
.cartbar .go{margin-right:auto}
.bump{animation:bump .4s}@keyframes bump{40%{transform:translateX(-50%) scale(1.05)}}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);display:flex;background:#fff;border-top:1px solid #EEE3F5;z-index:31;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.nav button{flex:1;border:0;background:none;padding:8px;font-size:14px;font-weight:800;color:var(--mut);border-radius:14px;cursor:pointer}
.nav button.on{background:var(--pll);color:var(--pd)}
.ov{position:fixed;inset:0;background:rgba(42,22,56,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fd .2s}
@keyframes fd{from{opacity:0}}
.sh{background:var(--bg);width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(60px);opacity:.4}}
.sh .hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sh .hd b{font-size:20px;font-weight:900;color:var(--pd)}
.sh .hd button{margin-right:auto;border:0;background:#fff;width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.08)}
.sh .pimg{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:18px;margin-bottom:10px;background:var(--pll)}
.sh .big{width:100%;aspect-ratio:16/10;border-radius:18px;margin-bottom:10px;display:flex;align-items:center;justify-content:center;font-size:80px;background:linear-gradient(135deg,var(--pll),#E2CFF2)}
.muted{color:var(--mut)}
label.f{display:block;font-size:14px;font-weight:800;margin:12px 2px 6px;color:var(--pd)}
.in{width:100%;border:2px solid #E8DAF2;background:#fff;border-radius:14px;padding:13px 14px;font-size:16px;outline:none;color:var(--ink)}
.in:focus{border-color:var(--pl)}
textarea.in{resize:vertical;min-height:70px}
.qty{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid #E8DAF2;border-radius:14px;padding:6px;width:max-content}
.qty button{width:42px;height:42px;border:0;border-radius:12px;background:var(--pll);font-size:22px;font-weight:900;color:var(--pd);cursor:pointer}
.qty b{min-width:46px;text-align:center;font-size:20px}
.seg{display:flex;gap:8px}
.seg button{flex:1;border:2px solid #E8DAF2;background:#fff;border-radius:14px;padding:12px 8px;font-size:15px;font-weight:800;color:var(--mut);cursor:pointer}
.seg button.on{border-color:var(--p);color:var(--pd);background:var(--pll)}
.row{display:flex;gap:10px}.row>*{flex:1}
.it{display:flex;gap:10px;align-items:center;background:#fff;border-radius:16px;padding:10px;margin-bottom:8px;box-shadow:0 3px 12px rgba(74,29,102,.06)}
.it img,.it .e{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:none;background:var(--pll);display:flex;align-items:center;justify-content:center;font-size:28px}
.it .t{flex:1;min-width:0}.it .t b{display:block;font-size:15px}.it .t small{color:var(--mut);font-size:12.5px;line-height:1.5;display:block}
.it .x{border:0;background:#FBE6EA;color:#B23A48;border-radius:10px;padding:8px 10px;font-weight:800;cursor:pointer}
.note{background:#FFF7E3;border:1px dashed var(--gold);border-radius:14px;padding:10px 12px;font-size:13.5px;line-height:1.6;margin:10px 0;color:#5A4410}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.okhead{text-align:center;padding:6px 0 10px}.okhead .ic{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;font-size:34px;display:flex;align-items:center;justify-content:center;margin:0 auto 8px}
.okhead b{display:block;font-size:19px}
/* البون */
.bon{position:relative;background:#fff;border-radius:16px;padding:16px 14px;box-shadow:var(--sh);direction:rtl;overflow:hidden}
.bon:before{content:"";position:absolute;inset:0 0 auto 0;height:7px;background:linear-gradient(90deg,var(--p),var(--gold),var(--p))}
.bon .bh{text-align:center;padding-top:4px}
.bon .bh img{width:70px;height:70px;border-radius:50%}
.bon .bh b{display:block;font-size:19px;color:var(--pd);margin-top:4px}
.bon .bh small{color:var(--mut);font-size:12.5px}
.bon .band{margin:10px 0;background:var(--pd);color:#fff;text-align:center;font-weight:900;padding:7px;border-radius:8px;letter-spacing:.5px;font-size:15px}
.bon .kv{display:flex;justify-content:space-between;font-size:13.5px;padding:3px 2px}
.bon table{width:100%;border-collapse:collapse;margin:8px 0;font-size:13px}
.bon th{background:var(--pll);color:var(--pd);padding:7px 5px;font-weight:800}
.bon td{border-bottom:1px solid #EFE6F5;padding:8px 5px;vertical-align:top}
.bon td small{color:var(--mut);display:block;line-height:1.5}
.bon .tot{display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;border-radius:12px;padding:11px 14px;font-weight:900;font-size:17px;margin-top:6px}
.bon .cli{background:var(--pll);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13.5px;line-height:1.7}
.bon .stamp{position:absolute;left:12px;top:22px;transform:rotate(-14deg);border:3px solid var(--gold);color:var(--gold);font-weight:900;border-radius:8px;padding:2px 10px;font-size:13px}
.bon .mer{text-align:center;color:var(--mut);font-size:13px;margin-top:10px}
/* المدير */
.ahero{margin:0;padding:22px 18px;background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;border-radius:0 0 30px 30px}
.ahero h1{margin:0 0 4px;font-size:24px}.ahero p{margin:0 0 14px;opacity:.85;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:rgba(255,255,255,.14);border-radius:16px;padding:10px;text-align:center}.stat b{display:block;font-size:24px}.stat span{font-size:12px;opacity:.85}
.box{background:#fff;border-radius:20px;padding:14px;margin:14px 16px;box-shadow:var(--sh)}
.box h3{margin:0 0 10px;font-size:17px;color:var(--pd);display:flex;gap:6px;align-items:center}.box h3 small{color:var(--mut);font-weight:600;font-size:12px;margin-right:auto}
.ord{border:2px solid #F0E6F6;border-radius:16px;padding:10px 12px;margin-bottom:8px}
.ord.new{border-color:var(--gold);background:#FFFBF1}
.ord .t{display:flex;justify-content:space-between;font-weight:800}.ord .t small{color:var(--mut)}
.ord .d{font-size:13px;color:var(--mut);margin:6px 0;line-height:1.6}
.ord .ft{display:flex;align-items:center;gap:8px}
.st{margin-right:auto;border:0;border-radius:20px;padding:7px 12px;font-weight:800;font-size:13px;cursor:pointer}
.s0{background:#FFF0C9;color:#7A5A00}.s1{background:#E8DDFB;color:#4A1D66}.s2{background:#DCEBFF;color:#1D4E89}.s3{background:#DDF5E7;color:#13703F}
.pr{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #F3EAF8}
.pr img,.pr .e{width:46px;height:46px;border-radius:12px;object-fit:cover;flex:none;background:var(--pll);display:flex;align-items:center;justify-content:center;font-size:24px}
.pr .nm{flex:1;font-weight:700;font-size:14px}
.pr input{width:92px;border:2px solid #E8DAF2;border-radius:10px;padding:8px;font-size:14px;text-align:center}
.sw{width:50px;height:30px;border-radius:20px;border:0;background:#DDD;position:relative;cursor:pointer;flex:none}
.sw:after{content:"";position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ok)}.sw.on:after{right:24px}
.foot{text-align:center;color:var(--mut);font-size:12.5px;padding:18px 20px 6px;line-height:1.7}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:16px;font-weight:800;font-size:14.5px;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:90%;text-align:center;animation:fd .2s}
</style>

function addP(id){const p=byId(id),det=[];
  for(const k of p.f){if(k==="qty")continue;const [key,lb]=F[k];const v=($("#f_"+key)||{}).value?.trim();if(v)det.push(`${SHORT[k]||lb}: ${v}`)}
  if(!det.length&&p.f.some(k=>!["qty","note"].includes(k)))return toast("✍️ اكتبي على الأقل تفصيل واحد");
  S.cart.push({pid:id,qty:S.form.qty||1,det:det.join(" · ")});closeSheet();render(true);toast("✅ تزادت للطلبية");
  const cb=$("#cb");cb.classList.remove("bump");void cb.offsetWidth;cb.classList.add("bump");
}
function openCart(){if(!S.cart.length)return;
  sheet(`<div class="hd"><b>🧾 طلبيتي</b><button onclick="closeSheet()">×</button></div>
   ${S.cart.map((c,i)=>{const p=byId(c.pid);return `<div class="it">${pic(p)}<div class="t"><b>${p.t}</b><small>الكمية: ${c.qty}${c.det?" · "+esc(c.det):""}</small></div><button class="x" onclick="S.cart.splice(${i},1);render(true);S.cart.length?openCart():closeSheet()">حذف</button></div>`}).join("")}
   <div class="note">💡 السعر النهائي تأكدهولك سميرة على حسب الكمية والتفاصيل، قبل ما تبدا الخدمة.</div>
   <button class="btn" onclick="checkout()">كمّلي ← معلوماتك</button><div style="height:8px"></div><button class="btn gh" onclick="closeSheet()">زيدي خدمة أخرى</button>`);
}
function checkout(){const c=S.cust||{};
  sheet(`<div class="hd"><b>📋 معلوماتك</b><button onclick="closeSheet()">×</button></div>
   <div class="row"><div><label class="f">الاسم</label><input class="in" id="cName" value="${esc(c.name)}"></div><div><label class="f">رقم الهاتف</label><input class="in" id="cTel" inputmode="tel" dir="ltr" placeholder="06 / 07 / 05" value="${esc(c.tel)}"></div></div>
   <label class="f">الولاية</label><select class="in" id="cWil">${WILAYAS.map((w,i)=>`<option value="${i+1}" ${(c.wil||1)==i+1?"selected":""}>${String(i+1).padStart(2,"0")} - ${w}</option>`).join("")}</select>
   <label class="f">البلدية / العنوان</label><input class="in" id="cPlace" value="${esc(c.place)}" placeholder="مثلاً: أولف، حي...">
   <label class="f">كيفاش تستلمي؟</label><div class="seg"><button class="${S.how==="del"?"on":""}" onclick="S.how='del';keepC();checkout()">🚚 توصيل</button><button class="${S.how==="pick"?"on":""}" onclick="S.how='pick';keepC();checkout()">🏪 نجي نديها</button></div>
   <div style="height:16px"></div><button class="btn" onclick="toBon()">🧾 شوفي البون ←</button>`);
}
function keepC(){const v=id=>($("#"+id)||{}).value?.trim()||"";S.cust={name:v("cName"),tel:v("cTel"),wil:+v("cWil")||1,place:v("cPlace")}}
function toBon(){keepC();const c=S.cust;
  if(!c.name)return toast("✍️ اكتبي اسمك");
  if(!/^0[5-7]\d{8}$/.test(c.tel.replace(/\s/g,"")))return toast("📞 رقم الهاتف ماشي صحيح");
  if(!c.place)return toast("📍 اكتبي البلدية ولا العنوان");
  const now=new Date();S.pending={no:S.seq,...c,how:S.how,items:S.cart.map(x=>({...x})),st:0,time:now.toTimeString().slice(0,5),mine:1};
  sheet(`<div class="hd"><b>🧾 البون تاعك</b><button onclick="closeSheet()">×</button></div>${bon(S.pending)}
   <div class="acts"><button class="btn wa" onclick="sendWA()">💬 ابعثي على واتساب</button><button class="btn" onclick="confirmO()">✅ أكّدي الطلب</button></div>
   <div style="height:8px"></div><button class="btn gh" onclick="checkout()">✏️ بدّلي المعلومات</button>`);
}
function bon(o){const d=new Date(),p2=n=>String(n).padStart(2,"0");
  return `<div class="bon"><span class="stamp">تجريبي</span><div class="bh"><img src="${LOGO}" alt=""><b>${SHOP.name}</b><small>${SHOP.place}</small></div>
   <div class="band">BON DE COMMANDE N° SM-${String(o.no).padStart(4,"0")}</div>
   <div class="kv"><span>${p2(d.getDate())}/${p2(d.getMonth()+1)}/${d.getFullYear()}</span><span>${o.time}</span></div>
   <table><tr><th style="text-align:right">الخدمة والتفاصيل</th><th>الكمية</th></tr>${o.items.map(it=>{const p=byId(it.pid);return `<tr><td><b>${p.t}</b>${it.det?`<small>${esc(it.det)}</small>`:""}</td><td style="text-align:center;font-weight:900">${it.qty}</td></tr>`}).join("")}</table>
   <div class="tot"><span>المجموع</span><span>${estTotal(o)}</span></div>
   <div class="cli">👤 ${esc(o.name)} · <span dir="ltr">${esc(o.tel)}</span><br>📍 ${String(o.wil).padStart(2,"0")} - ${WILAYAS[o.wil-1]} · ${esc(o.place)}<br>${o.how==="del"?"🚚 توصيل":"🏪 تجي تديها من المحل"}</div>
   <div class="mer">شكرا على ثقتك 💜 Merci de votre confiance</div></div>`}
function estTotal(o){let t=0,all=true;for(const it of o.items){const pr=S.price[it.pid];if(pr)t+=pr*it.qty;else all=false}return all&&t?`${fmt(t)} دج`:"تأكدهولك سميرة"}
function msg(o){return `سلام سميرة 💜 طلبية جديدة رقم SM-${String(o.no).padStart(4,"0")}\n${o.items.map(it=>`- ${byId(it.pid).t} × ${it.qty}${it.det?`\n  (${it.det})`:""}`).join("\n")}\n👤 ${o.name} — ${o.tel}\n📍 ${String(o.wil).padStart(2,"0")} ${WILAYAS[o.wil-1]} — ${o.place}\n${o.how==="del"?"🚚 توصيل":"🏪 نجي نديها"}`}
function waNum(p){p=String(p).replace(/\D/g,"");return p.startsWith("0")?"213"+p.slice(1):p}
function sendWA(){const o=S.pending;if(!SHOP.wa){toast("📲 في النسخة الحقيقية: البون يتبعث ديراكت لواتساب سميرة. (حطي رقمك في «لوحة سميرة»)",4200);return}
  window.open(`https://wa.me/${waNum(SHOP.wa)}?text=${encodeURIComponent(msg(o))}`,"_blank");confirmO(true)}
function waDirect(){if(!SHOP.wa)return toast("📲 في النسخة الحقيقية: يفتح واتساب سميرة ديراكت",3200);window.open(`https://wa.me/${waNum(SHOP.wa)}`,"_blank")}
function confirmO(silent){const o=S.pending;if(!o)return;S.orders.unshift(o);S.seq++;S.cart=[];S.pending=null;render(true);
  sheet(`<div class="okhead"><div class="ic">✓</div><b>وصلت الطلبية! شكرا ${esc(o.name)} 💜</b><span class="muted">سميرة تتصل بيك باش تأكد التفاصيل والسعر</span></div>${bon(o)}
   <div class="note">💡 <b>في النسخة الحقيقية:</b> الطلبية توصل لسميرة ديراكت في لوحتها (وفي التيليفون)، وتبدّل حالتها: قيد التصميم، قيد الطباعة، جاهزة.</div>
   <button class="btn" onclick="closeSheet();go('admin')">👑 شوفي كيفاش توصل لسميرة</button><div style="height:8px"></div><button class="btn gh" onclick="closeSheet()">رجوع للمتجر</button>`);
}
/* ================= لوحة سميرة (معاينة) ================= */
const ST=["جديدة","قيد التصميم","قيد الطباعة","جاهزة ✓"];
function admin(){const o=S.orders;
  return `<header class="ahero"><h1>👑 لوحة سميرة</h1><p>هنا تتبعي الطلبيات وتبدّلي في المتجر وحدك، من التيليفون</p>
    <div class="stats"><div class="stat"><b>${o.length}</b><span>طلبيات</span></div><div class="stat"><b>${o.filter(x=>x.st===0).length}</b><span>جديدة</span></div><div class="stat"><b>${o.filter(x=>x.st<3).length}</b><span>مازال ما كملوش</span></div></div></header>
   <div class="box"><h3>📦 الطلبيات <small>اضغطي على الحالة باش تبدّليها</small></h3>
    ${o.map((x,i)=>`<div class="ord ${x.st===0?"new":""}"><div class="t"><span>#SM-${String(x.no).padStart(4,"0")} · ${esc(x.name)} ${x.mine?"🆕":""}</span><small>${x.time}</small></div>
      <div class="d">${x.items.map(it=>`${byId(it.pid).t} × ${it.qty}${it.det?` <br><small>${esc(it.det)}</small>`:""}`).join("<br>")}<br>📍 ${WILAYAS[x.wil-1]} · ${esc(x.place)} · ${x.how==="del"?"🚚 توصيل":"🏪 تجي تديها"}</div>
      <div class="ft"><a class="btn sm gh" style="width:auto;flex:none" href="tel:${esc(x.tel.replace(/\s/g,""))}">📞 عيّطي</a><button class="st s${x.st}" onclick="S.orders[${i}].st=(S.orders[${i}].st+1)%4;render(true)">${ST[x.st]}</button></div></div>`).join("")}</div>
   <div class="box"><h3>🛍️ الخدمات والأسعار <small>تبدّلي وحدك</small></h3>
    ${P.map(p=>`<div class="pr">${pic(p)}<div class="nm">${p.t}</div><input inputmode="numeric" placeholder="السعر" value="${S.price[p.id]||""}" onchange="setPrice(${p.id},this.value)" aria-label="السعر"><button class="sw ${S.avail[p.id]?"on":""}" aria-label="متوفر" onclick="S.avail[${p.id}]=!S.avail[${p.id}];render(true);toast(S.avail[${p.id}]?'✅ ولّات متوفرة':'⏸️ تخبات مؤقتاً')"></button></div>`).join("")}
    <p class="muted" style="font-size:12.5px;margin:8px 2px">السعر فارغ = «السعر حسب الطلب». حطي سعر باش يبان «ابتداءً من».</p>
    <button class="btn gh" onclick="toast('➕ في النسخة الكاملة: تزيدي خدمة جديدة بالتصويرة تاعها من التيليفون',3200)">➕ زيدي خدمة جديدة</button></div>
   <div class="box"><h3>⚙️ معلومات المتجر</h3>
    <label class="f">رقم الواتساب اللي توصلك فيه الطلبيات</label><input class="in" dir="ltr" inputmode="tel" placeholder="06xx xx xx xx" value="${esc(SHOP.wa)}" onchange="SHOP.wa=this.value.trim();toast('✅ تسجّل الرقم — جرّبي «ابعثي على واتساب»')">
    <p class="muted" style="margin:10px 2px 0;font-size:13px">والاسم، اللوغو، الألوان، الولايات اللي توصلي ليها… كلش يتبدّل من هنا.</p></div>
   <div class="foot">هذه معاينة باش تشوفي الفكرة — في النسخة الحقيقية اللوحة محمية بكلمة سر، وما يدخلها غير سميرة</div>`}
function setPrice(id,v){const n=parseInt(String(v).replace(/\D/g,""),10);if(n)S.price[id]=n;else delete S.price[id];toast("✅ السعر تبدّل في المتجر");render(true)}
/* ================= العرض ================= */
function go(v){S.view=v;$("#nShop").classList.toggle("on",v==="shop");$("#nAdm").classList.toggle("on",v==="admin");render();window.scrollTo(0,0)}
function render(keep){const y=window.scrollY;$("#app").innerHTML=S.view==="shop"?shop():admin();
  const cb=$("#cb");cb.classList.toggle("on",S.view==="shop"&&S.cart.length>0);$("#cbn").textContent=S.cart.length;if(keep)window.scrollTo(0,y)}
render();
</script>
</body>
</html>
