<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title> </title>
<style id="st">
html,body{margin:0;padding:0;background:#fff}
@media screen{
  body{background:#E9E2DA;font-family:Tahoma,Arial,sans-serif;padding:16px;direction:rtl}
  .hd{max-width:520px;margin:0 auto 14px;background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 6px 20px rgba(0,0,0,.08);line-height:1.7}
  .hd b{font-size:18px}.hd button{font:inherit;font-weight:800;font-size:17px;border:0;border-radius:12px;padding:12px 18px;background:#3B1F14;color:#fff;cursor:pointer;margin-top:8px}
  #labels{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  #labels .lb{width:calc(var(--w) * 5px);height:calc(var(--h) * 5px);border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
}
@media print{
  .hd{display:none}
  #labels .lb{width:100vw;height:100vh;break-after:page;page-break-after:always}
  #labels .lb:last-child{break-after:auto;page-break-after:auto}
}
</style>
</head>
<body>
<div class="hd"><b>🏷️ ملصقات Lamine Pro</b><br>في نافذة الطباعة اختار الطابعة <b>Xprinter XP-410B</b>، الهوامش <b>بلا</b>، والحجم <b>100%</b>.<br><button onclick="print()">🖨️ اطبع</button></div>
<div id="labels"></div>
<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
/* ============================================================
   🏷️ ملصقات السعر (Xprinter XP-410B) + الباركود Code128
   الطباعة تتحل في Microsoft Edge (باش تختار طابعة الملصقات، والتيكيات تبقى في XP-80)
   ============================================================ */
const C128 = "212222 222122 222221 121223 121322 131222 122213 122312 132212 221213 221312 231212 112232 122132 122231 113222 123122 123221 223211 221132 221231 213212 223112 312131 311222 321122 321221 312212 322112 322211 212123 212321 232121 111323 131123 131321 112313 132113 132311 211313 231113 231311 112133 112331 132131 113123 113321 133121 313121 211331 231131 213113 213311 213131 311123 311321 331121 312113 312311 332111 314111 221411 431111 111224 111422 121124 121421 141122 141221 112214 112412 122114 122411 142112 142211 241211 221114 413111 241112 134111 111242 121142 121241 114212 124112 124211 411212 421112 421211 212141 214121 412121 111143 111341 131141 114113 114311 411113 411311 113141 114131 311141 411131 211412 211214 211232".split(" ");
function c128codes(t) {
  t = String(t || ""); const v = [];
  if (/^\d+$/.test(t) && t.length >= 2) {
    let s = t;
    if (s.length % 2) { v.push(104, s.charCodeAt(0) - 32, 99); s = s.slice(1); } else v.push(105);
    for (let i = 0; i < s.length; i += 2) v.push(+s.slice(i, i + 2));
  } else { v.push(104); for (const ch of t) { const c = ch.charCodeAt(0); v.push(c >= 32 && c < 128 ? c - 32 : 0); } }
  let sum = v[0]; for (let i = 1; i < v.length; i++) sum += v[i] * i;
  v.push(sum % 103); return v;
}
// باركود SVG (يعمّر العرض والطول تاع الخانة اللي فيها)
function c128svg(t) {
  const pats = c128codes(t).map(c => C128[c]).concat("2331112"); let x = 10, r = "";
  for (const p of pats) for (let i = 0; i < p.length; i++) { const w = +p[i]; if (i % 2 === 0) r += `<rect x="${x}" y="0" width="${w}" height="100"/>`; x += w; }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${x + 10} 100" preserveAspectRatio="none" width="100%" height="100%" shape-rendering="crispEdges">${r}</svg>`;
}
// باركود داخلي للمحل (EAN-13 يبدا بـ 200)
function newShopBarcode() {
  let d = "200" + String(Date.now()).slice(-7) + String(Math.floor(Math.random() * 100)).padStart(2, "0");
  d = d.slice(0, 12); let s = 0; for (let i = 0; i < 12; i++) s += +d[i] * (i % 2 ? 3 : 1);
  return d + ((10 - s % 10) % 10);
}
const LBL_SIZES = [["auto", "حسب الطابعة"], ["40x20", "40×20"], ["40x30", "40×30"], ["50x25", "50×25"], ["50x30", "50×30"], ["60x40", "60×40"]];
const lblCfg = () => Object.assign({size: "auto", mode: "full"}, ls("lp_lbl") || {});
function labelItem(pid) {
  const p = prod(pid), inv = S.inv[pid] || {};
  return {name: p.name, bc: inv.barcode || "", price: +p.price || 0, unit: isKg(p) ? "/kg" : ""};
}
// نفس الشكل في المعاينة والطباعة: القياسات بـ cqh/cqw (نسبة للملصق)
const LBL_CSS = `.lb{container-type:size;box-sizing:border-box;padding:3cqh 3cqw 2.5cqh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:1cqh;overflow:hidden;font-family:Tahoma,Arial,sans-serif;color:#000;background:#fff;text-align:center}
.lb .s{font-size:8.5cqh;line-height:1;flex:none}.lb .n{font-size:15cqh;font-weight:900;line-height:1.05;direction:rtl;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;flex:none}
.lb .b{width:86cqw;flex:1 1 0;min-height:16cqh}.lb .d{font-size:8cqh;letter-spacing:.5cqw;line-height:1;direction:ltr;flex:none}.lb .p{font-size:24cqh;font-weight:900;line-height:1;white-space:nowrap;direction:ltr;unicode-bidi:isolate;flex:none}
.lb.po{justify-content:center;gap:4cqh}.lb.po .n{font-size:18cqh}.lb.po .p{font-size:38cqh}`;
function labelHTML(it, mode, shop) {
  const price = Number(it.price || 0).toLocaleString("fr-FR", {minimumFractionDigits: 2, maximumFractionDigits: 2}).replace(/ | /g, " ");
  const po = mode === "price" || !it.bc;
  return `<div class="lb ${po ? "po" : ""}"><div class="s">${esc(shop || "")}</div><div class="n">${esc(it.name)}</div>${po ? "" : `<div class="b">${c128svg(it.bc)}</div><div class="d">${esc(it.bc)}</div>`}<div class="p">${price} DA${it.unit ? `<small style="font-size:.5em"> ${it.unit}</small>` : ""}</div></div>`;
}
function openLabel(pid) {
  const p = prod(pid); if (!p) return; const c = lblCfg(), it = labelItem(pid), q = qtyOf(pid);
  S.ui.lblPid = pid; S.ui.lblN = S.ui.lblN || 1;
  const [w, h] = (c.size === "auto" ? "50x25" : c.size).split("x").map(Number);
  modal(`<h2>🏷️ ملصق السعر<button class="x" onclick="closeModal()">×</button></h2>
    <style>${LBL_CSS}.lbprev{display:flex;justify-content:center;padding:14px;background:var(--soft);border-radius:16px}.lbprev .lb{width:${w * 5.6}px;height:${h * 5.6}px;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.15)}</style>
    <div class="lbprev">${labelHTML(it, c.mode, SHOP.name)}</div>
    ${it.bc ? "" : `<div class="note warn" style="margin-top:10px">هاد السلعة ما عندهاش باركود. <button class="mini" onclick="genBarcode('${pid}')">🔢 دير باركود جديد</button></div>`}
    <label class="f">واش تطبع؟</label>
    <div class="seg"><button class="${c.mode !== "price" ? "on" : ""}" onclick="setLbl({mode:'full'})">🔢 الباركود + السعر</button><button class="${c.mode === "price" ? "on" : ""}" onclick="setLbl({mode:'price'})">💲 السعر برك</button></div>
    <label class="f">شحال من ملصق؟</label>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input class="in" id="lb_n" inputmode="numeric" value="${S.ui.lblN}" style="width:110px;text-align:center;font-size:22px;font-weight:900">
      ${[1, 5, 10].map(n => `<button class="chip" onclick="$('#lb_n').value=${n}">${n}</button>`).join("")}${q > 0 && !isKg(p) ? `<button class="chip" onclick="$('#lb_n').value=${Math.min(200, Math.round(q))}">كيما المخزون (${Math.round(q)})</button>` : ""}</div>
    <label class="f">قياس الملصق (مم)</label>
    <div class="chips" style="flex-wrap:wrap">${LBL_SIZES.map(([k, l]) => `<button class="chip ${c.size === k ? "on" : ""}" onclick="setLbl({size:'${k}'})">${l}</button>`).join("")}</div>
    <div style="height:14px"></div><button class="btn dark" onclick="printLabels([{...labelItem('${pid}'),n:num($('#lb_n').value)||1}])">🖨️ اطبع في طابعة الملصقات</button>
    <p class="muted" style="font-size:13px;margin:10px 2px 0">يتحل <b>Microsoft Edge</b> بالملصقات. أول مرة: اختار <b>Xprinter XP-410B</b> في «الطابعة»، و Edge يتفكّرها.</p>`);
}
function setLbl(o) { S.ui.lblN = num(($("#lb_n") || {}).value) || S.ui.lblN; ls("lp_lbl", Object.assign(lblCfg(), o)); openLabel(S.ui.lblPid); }
async function genBarcode(pid) {
  const bc = newShopBarcode();
  try { await commitFast([{t: "set", c: "inv", id: pid, d: {barcode: bc, updatedAt: Date.now()}, merge: true}], "barcode"); } catch (e) { return toast("❌ " + (e.code || e.message)); }
  S.inv[pid] = Object.assign(S.inv[pid] || {}, {barcode: bc}); toast("🔢 تزاد الباركود: " + bc); openLabel(pid);
}
function printLabels(items) {
  const c = lblCfg(), data = {shop: SHOP.name || "", mode: c.mode, size: c.size, items: items.map(x => ({name: x.name, bc: x.bc, price: x.price, unit: x.unit, n: Math.max(1, Math.min(500, Math.round(x.n || 1)))}))};
  const url = new URL("labels.html", location.href).href + "#" + encodeURIComponent(JSON.stringify(data));
  if (/Windows/i.test(navigator.userAgent)) { location.href = "microsoft-edge:" + url; toast("🏷️ راهي تتحل في Edge...", 3000); }
  else window.open(url, "_blank");
}

(function () {
  let d = {};
  try { d = JSON.parse(decodeURIComponent(location.hash.slice(1))); } catch (e) {}
  const items = d.items || [];
  const [w, h] = (d.size && d.size !== "auto" ? d.size : "50x25").split("x").map(Number);
  document.documentElement.style.setProperty("--w", w); document.documentElement.style.setProperty("--h", h);
  const st = document.getElementById("st");
  st.textContent += LBL_CSS + (d.size && d.size !== "auto" ? `@page{size:${w}mm ${h}mm;margin:0}` : `@page{margin:0}`);
  let html = ""; for (const it of items) for (let i = 0; i < (it.n || 1); i++) html += labelHTML(it, d.mode, d.shop);
  document.getElementById("labels").innerHTML = html || "<p style='text-align:center'>ما كاين حتى ملصق</p>";
  if (html) setTimeout(() => print(), 400);
})();
</script>
</body>
</html>
