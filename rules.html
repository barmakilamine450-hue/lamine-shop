<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>قواعد Firebase — Lamine</title>
<style>body{margin:0;font-family:system-ui,Tahoma,sans-serif;background:#F7F1EA;color:#24140C}.w{max-width:760px;margin:0 auto;padding:18px}
h1{font-size:22px;margin:6px 0 12px}ol{line-height:2;font-size:16px;background:#fff;border-radius:16px;padding:12px 34px 12px 14px}
button{width:100%;font:inherit;font-weight:800;font-size:20px;border:0;border-radius:14px;padding:16px;background:#E8721C;color:#fff;cursor:pointer;margin:10px 0}
pre{direction:ltr;text-align:left;background:#1E1612;color:#F2E8DF;border-radius:14px;padding:14px;font-size:12px;overflow:auto;max-height:50vh;white-space:pre}
button.ok{background:#17935A}.bad{background:#FDE7E5;color:#9B2C25;border-radius:12px;padding:12px;font-weight:700;display:none}</style></head>
<body><div class="w"><h1>🔐 قواعد Firebase (Lamine Pro + متجر سميرة)</h1>
<div class="bad" id="bad">⚠️ الرابط ناقص: افتح الرابط كامل كيما بعثهولك Claude.</div>
<button id="cp" onclick="cp()">📋 انسخ القواعد</button>
<ol><li>حل <b>console.firebase.google.com</b> بالحساب اللي فيه المشروع</li><li>المشروع <b>lamine-shop</b> ← <b>Firestore Database</b> ← <b>Règles / Rules</b></li><li>امسح كلش اللي مكتوب، وألصق (Ctrl+V)</li><li>اضغط <b>Publier / Publish</b></li></ol>
<pre id="r"></pre></div>
<script>
const T="rules_version = '2';\nservice cloud.firestore {\n  match /databases/{db}/documents {\n\n    // ===== شكون هو =====\n    function signedIn() { return request.auth != null; }\n    function ownerPath() { return /databases/$(db)/documents/config/owner; }\n    // مول المحل = أول حساب Google سجّل روحو في config/owner\n    function isOwner() {\n      return signedIn() && exists(ownerPath()) && get(ownerPath()).data.uid == request.auth.uid;\n    }\n    function staffPath() { return /databases/$(db)/documents/staff/$(request.auth.uid); }\n    // خدام مفعّل\n    function isWorker() {\n      return signedIn() && exists(staffPath()) && get(staffPath()).data.active == true;\n    }\n    function isStaff() { return isOwner() || isWorker(); }\n    function myEmail() { return request.auth.token.email.lower(); }\n\n    // ===== مول المحل: يتسجّل مرة وحدة برك =====\n    match /config/owner {\n      allow read: if signedIn();\n      allow create: if signedIn()\n        && request.auth.token.firebase.sign_in_provider == 'google.com'\n        && request.resource.data.uid == request.auth.uid;\n      allow update, delete: if false;\n    }\n\n    // ===== السلع: الزبائن يشوفوها، مول المحل يبدّلها =====\n    match /products/{id} {\n      allow read: if true;\n      allow write: if isOwner();\n      // الخدام يقدر يبدّل غير «متوفرة / نفدت»\n      allow update: if isWorker()\n        && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['stock', 'autoOut']);\n    }\n\n    // ===== إعدادات المحل (تبان للزبائن) =====\n    match /settings/shop {\n      allow read: if true;\n      allow write: if isOwner();\n    }\n    // إعدادات البرنامج (الإشعارات، الحدود...)\n    match /settings/pro {\n      allow read: if isStaff();\n      allow write: if isOwner();\n    }\n    match /meta/{doc} {\n      allow read, write: if isStaff();\n    }\n\n    // ===== طلبيات الموقع =====\n    match /orders/{id} {\n      allow create: if request.resource.data.status == 'new'\n        && request.resource.data.customer.phone is string\n        && request.resource.data.customer.first is string\n        && request.resource.data.items is list\n        && request.resource.data.items.size() > 0\n        && request.resource.data.items.size() <= 60\n        && request.resource.data.total is number;\n      allow read, update: if isStaff();\n      allow delete: if isOwner();\n    }\n\n    // ===== المخزون والصلاحية: مول المحل والخدامين =====\n    match /inv/{id} {\n      allow read, write: if isStaff();\n    }\n    match /batches/{id} {\n      allow read, write: if isStaff();\n    }\n    match /moves/{id} {\n      allow create: if isStaff() && request.resource.data.by == request.auth.uid;\n      allow read, update, delete: if isOwner();\n    }\n\n    // ===== البيع: الخدام يبيع، مول المحل وحدو يشوف المبيعات والربح =====\n    match /sales/{id} {\n      allow create: if isStaff() && request.resource.data.by == request.auth.uid;\n      allow read, update, delete: if isOwner();\n    }\n\n    // ===== حوايج مول المحل برك =====\n    match /costs/{id}     { allow read, write: if isOwner(); }\n    match /customers/{id} { allow read, write: if isOwner(); }\n    match /debtTx/{id}    { allow read, write: if isOwner(); }\n    match /suppliers/{id} { allow read, write: if isOwner(); }\n    match /purchases/{id} { allow read, write: if isOwner(); }\n    match /supTx/{id}     { allow read, write: if isOwner(); }\n\n    // ===== الخدامين =====\n    match /invites/{email} {\n      allow read, write: if isOwner();\n      allow get: if signedIn() && myEmail() == email;\n    }\n    match /staff/{uid} {\n      allow read: if isOwner() || (signedIn() && request.auth.uid == uid);\n      allow create: if signedIn() && request.auth.uid == uid\n        && exists(/databases/$(db)/documents/invites/$(myEmail()))\n        && request.resource.data.role == 'worker'\n        && request.resource.data.active == true\n        && request.resource.data.email == myEmail();\n      allow update, delete: if isOwner();\n    }\n\n    // ===== متاجر الزبائن (خدمة المواقع) =====\n    // كل متجر عندو كود تفعيل. صاحب المتجر يفعّلو مرة وحدة بحساب Google تاعو.\n    function storeCode(sid) { return {'samira': '__SAMIRA__'}.get(sid, ''); }\n    function storeOwner(sid) { return get(/databases/$(db)/documents/stores/$(sid)).data.owner; }\n    match /stores/{sid} {\n      allow read: if true;\n      allow create: if signedIn()\n        && request.resource.data.owner == request.auth.uid\n        && storeCode(sid) != ''\n        && request.resource.data.code == storeCode(sid);\n      allow update: if isOwner() || (signedIn()\n        && resource.data.owner == request.auth.uid\n        && request.resource.data.owner == resource.data.owner);\n      allow delete: if isOwner();\n      // الطلبيات: الزبون يبعث، صاحب المتجر وحدو يشوف\n      match /orders/{oid} {\n        allow create: if request.resource.data.st == 0\n          && request.resource.data.name is string && request.resource.data.name.size() <= 80\n          && request.resource.data.tel is string && request.resource.data.tel.size() <= 20\n          && request.resource.data.items is list\n          && request.resource.data.items.size() > 0\n          && request.resource.data.items.size() <= 40;\n        allow read, update, delete: if signedIn() && storeOwner(sid) == request.auth.uid;\n      }\n    }\n  }\n}\n";
const code=decodeURIComponent(location.hash.slice(1)).trim().toUpperCase();
const ok=/^SAM-[A-Z0-9]{6}$/.test(code);
const R=T.replace("__SAMIRA__",ok?code:"__SAMIRA__");
document.getElementById("r").textContent=R;
if(!ok){document.getElementById("bad").style.display="block";document.getElementById("cp").disabled=true;document.getElementById("cp").style.opacity=.4}
async function cp(){try{await navigator.clipboard.writeText(R)}catch(e){const t=document.createElement("textarea");t.value=R;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove()}
 const b=document.getElementById("cp");b.textContent="✅ تنسخت! روح ألصقها في Firebase";b.className="ok"}
</script></body></html>
